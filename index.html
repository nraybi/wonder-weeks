  // ─── PATTERN GRID (7-day heatmap) ────────────────────────────────────────────
  function PatternGrid({events,color,bgColor,T,S,type,onSelect,selectedId}){
    const[ready,setReady]=useState(false);
    useEffect(()=>{const t=setTimeout(()=>setReady(true),240);return()=>clearTimeout(t);},[]);

    // Self-ticking clock for the "now" reference line — kept internal so this
    // component doesn't require its callers to maintain a live clock.
    const[now,setNow]=useState(Date.now());
    useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),60000);return()=>clearInterval(t);},[]);

    const days=useMemo(()=>{
      const result=[];
      const nowTs=Date.now();
      for(let i=6;i>=0;i--){
        const dayStart=startOfDay(nowTs-i*86400000);
        const dayEnd=dayStart+86400000;
        const prevDayStart=dayStart-86400000;
        // Events that start within this day
        const startsToday=events.filter(e=>e.start>=dayStart&&e.start<dayEnd);
        // Events that started the PREVIOUS day but whose end (or "now" if ongoing)
        // crosses into this day — these get a continuation sliver at the top.
        const continuesFromPrev=events.filter(e=>{
          if(e.start<prevDayStart||e.start>=dayStart)return false;
          const effectiveEnd=e.end||nowTs;
          return effectiveEnd>=dayStart;
        });
        result.push({dayStart,startsToday,continuesFromPrev});
      }
      return result;
    },[events]);

    const CELL_H=200; // pixels representing 24h
    const dayNames=S[type].days;
    const nowMin=minutesInDay(now);
    const nowLineColor=T.ds==="dark"?"rgba(255,255,255,.5)":"rgba(15,23,42,.4)";

    const isSelected=ev=>onSelect&&selectedId!=null&&String(ev.id)===String(selectedId);
    const selectedStyle={boxShadow:`0 0 0 2px rgba(255,255,255,.95), 0 0 10px 2px ${color}`,zIndex:3,animation:"pulse 1.6s ease-in-out infinite"};

    if(!ready)return<div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`}}>
      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:10}}>{S[type].patternTitle}</div>
      <div style={{display:"flex",gap:4}}>
        {Array.from({length:7},(_,i)=><div key={i} style={{flex:1}}><Shimmer height={CELL_H} T={T}/></div>)}
      </div>
    </div>;

    return<div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`,animation:"fadeUp .3s ease"}}>
      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:10}}>{S[type].patternTitle}</div>
      <div style={{display:"flex",gap:4}}>
        {/* Time axis — absolutely positioned at exact 0/25/50/75/100% so it always
            lines up with the hour grid-lines inside each day column, regardless of
            the day-name label row's height below. */}
        <div style={{display:"flex",flexDirection:"column",flexShrink:0}}>
          <div style={{position:"relative",height:CELL_H,width:20}}>
            {[["00",0],["06",25],["12",50],["18",75],["24",100]].map(([h,pct])=>(
              <div key={h} style={{position:"absolute",top:`${pct}%`,transform:pct===0?"translateY(0)":pct===100?"translateY(-100%)":"translateY(-50%)",fontSize:9,color:T.muted,lineHeight:1}}>{h}</div>
            ))}
            {/* Current time-of-day, lined up with the now-line drawn across the day columns */}
            <div style={{position:"absolute",top:`${(nowMin/1440)*100}%`,transform:"translateY(-50%)",fontSize:8.5,fontWeight:800,color:nowLineColor,lineHeight:1,whiteSpace:"nowrap"}}>{fmtTime(now)}</div>
          </div>
          <div style={{height:17}}/>
        </div>
        {/* Day columns, wrapped so a single "now" line can span all of them */}
        <div style={{position:"relative",display:"flex",gap:4,flex:1}}>
          {days.map(({dayStart,startsToday,continuesFromPrev},di)=>{
            const dayLabel=dayNames[(new Date(dayStart)).getDay()];
            return<div key={di} style={{flex:1,display:"flex",flexDirection:"column",gap:3}}>
              <div style={{height:CELL_H,background:T.surface2,borderRadius:8,position:"relative",overflow:"hidden"}}>
                {/* Hour grid lines */}
                {[6,12,18].map(h=><div key={h} style={{position:"absolute",left:0,right:0,top:`${(h/24)*100}%`,height:1,background:"rgba(128,128,128,.12)"}}/>)}
                {type==="sleep"&&startsToday.map((ev,ei)=>{
                  const startMin=minutesInDay(ev.start);
                  const crossesMidnight=ev.end?(dayKey(ev.end)!==dayKey(ev.start)):(dayKey(Date.now())!==dayKey(ev.start));
                  const endMin=crossesMidnight?1440:(ev.end?minutesInDay(ev.end):Math.min(minutesInDay(ev.start)+60,1440));
                  const durMin=endMin-startMin;
                  const topPct=(startMin/1440)*100;
                  const hPct=Math.max((durMin/1440)*100,1.5);
                  const sel=isSelected(ev);
                  return<div key={"s"+ei} onClick={()=>onSelect?.(ev)} style={{position:"absolute",left:2,right:2,top:`${topPct}%`,height:`${hPct}%`,background:color,borderRadius:8,opacity:sel?1:.85,cursor:onSelect?"pointer":"default",...(sel?selectedStyle:null)}}/>;
                })}
                {type==="sleep"&&continuesFromPrev.map((ev,ei)=>{
                  const endMin=ev.end?minutesInDay(ev.end):minutesInDay(Date.now());
                  const hPct=Math.max((endMin/1440)*100,1.5);
                  // Same underlying event as its startsToday half on the previous day —
                  // clicking either fragment opens the one true continuous session
                  // (real start/end spanning midnight), not just this visible sliver.
                  // Selection highlight applies here too, so both fragments glow together.
                  const sel=isSelected(ev);
                  return<div key={"c"+ei} onClick={()=>onSelect?.(ev)} style={{position:"absolute",left:2,right:2,top:0,height:`${hPct}%`,background:color,borderRadius:8,opacity:sel?1:.85,cursor:onSelect?"pointer":"default",...(sel?selectedStyle:null)}}/>;
                })}
                {type==="feed"&&startsToday.map((ev,ei)=>{
                  const min=minutesInDay(ev.start);
                  const topPct=(min/1440)*100;
                  const sel=isSelected(ev);
                  // Wrapped in a taller invisible hit area (14px) so the thin 6px dot
                  // stays easy to tap on mobile without changing how it looks.
                  return<div key={ei} onClick={()=>onSelect?.(ev)} style={{position:"absolute",left:2,right:2,top:`calc(${topPct}% - 7px)`,height:14,display:"flex",alignItems:"center",cursor:onSelect?"pointer":"default",zIndex:sel?3:1}}>
                    <div style={{width:"100%",height:6,background:color,borderRadius:8,opacity:sel?1:.9,boxShadow:sel?`0 0 0 2px rgba(255,255,255,.95), 0 0 8px 2px ${color}`:"none",animation:sel?"pulse 1.6s ease-in-out infinite":"none"}}/>
                  </div>;
                })}
              </div>
              <div style={{fontSize:10,color:T.sub,textAlign:"center",fontWeight:600}}>{dayLabel}</div>
            </div>;
          })}
          {/* "Now" reference line — same time-of-day across every column, so users
              can compare what's happening right now against other days */}
          <div style={{position:"absolute",left:0,right:0,top:`${(nowMin/1440)*CELL_H}px`,borderTop:`1.5px dashed ${nowLineColor}`,pointerEvents:"none",zIndex:2}}/>
        </div>
      </div>
    </div>;
  }

  // ─── CIRCULAR TIMELINE CANVAS ───────────────────────────────────────────────
  // Capsule sleep blocks sit ON the arc; dashed = predicted; solid = logged
  function CircularTimeline({sleeps,activeSleep,nextPred,now,onToggle,S,lang,sunTimes,morningWakeTs}){
    const sunriseMin=sunTimes?.sunriseMin??360;
    const sunsetMin=sunTimes?.sunsetMin??1200;
    const canvasRef=useRef(null);
    const SIZE=320;
    const CX=SIZE/2, CY=SIZE/2;
    const R=118; // track radius
    // Same boundary as everywhere else (computeMorningWake) — not calendar
    // midnight — so the dial agrees with today's stats and the predictor on
    // where "today" starts. Falls back to calendar midnight only while
    // still asleep pre-dawn (morningWakeTs===Infinity, no real boundary yet).
    const windowStart=(morningWakeTs&&morningWakeTs!==Infinity)?morningWakeTs:startOfDay(now);
    const windowEnd=windowStart+86400000;
    // Strictly sleeps that started within today's window — nothing from
    // before the boundary, even if it's still ongoing or ends after it, per
    // explicit instruction: no previous day/night sleep on the dial at all.
    const todaySleeps=sleeps.filter(s=>s.start>=windowStart && s.start<windowEnd);

    // minutes-of-day → canvas angle (midnight = top)
    const m2a=m=>(m/1440)*Math.PI*2-Math.PI/2;
    // angle + radius → {x,y}
    const polar=(a,r)=>({x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r});

    useEffect(()=>{
      const canvas=canvasRef.current; if(!canvas)return;
      const dpr=window.devicePixelRatio||1;
      canvas.width=SIZE*dpr; canvas.height=SIZE*dpr;
      canvas.style.width=SIZE+"px"; canvas.style.height=SIZE+"px";
      const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,SIZE,SIZE);

      // ── base track ring ──
      ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,255,255,.06)"; ctx.lineWidth=22; ctx.stroke();
      ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
      ctx.strokeStyle="rgba(99,102,241,.08)"; ctx.lineWidth=18; ctx.stroke();

      // ── draw a sleep block as a thick arc capsule ──
      const drawArc=(startMin,endMin,solid,glowing)=>{
        const a1=m2a(startMin), a2=m2a(Math.min(endMin,1439));
        if(solid){
          // glow pass
          if(glowing){
            ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
            ctx.strokeStyle="rgba(139,92,246,.4)"; ctx.lineWidth=26;
            ctx.shadowBlur=20; ctx.shadowColor="#8b5cf6"; ctx.stroke(); ctx.shadowBlur=0;
          }
          // solid fill
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle=glowing?"#a78bfa":"rgba(139,92,246,.7)";
          ctx.lineWidth=18; ctx.lineCap="round"; ctx.stroke();
          // inner highlight
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=4; ctx.lineCap="round"; ctx.stroke();
        } else {
          // dashed predicted
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle="rgba(139,92,246,.35)"; ctx.lineWidth=18; ctx.lineCap="round"; ctx.stroke();
          ctx.setLineDash([5,6]);
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle="rgba(200,180,255,.55)"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.stroke();
          ctx.setLineDash([]);
        }
      };

      // ── actual sleeps today ──
      todaySleeps.forEach(s=>{
        const sm=minutesInDay(s.start);
        const em=s.end?minutesInDay(s.end):minutesInDay(now);
        drawArc(sm,em,true,!!activeSleep&&!s.end);
      });

      // ── sunrise anchor (real local time) ──
      const sunA=m2a(sunriseMin); const sunP=polar(sunA,R);
      ctx.beginPath(); ctx.arc(sunP.x,sunP.y,12,0,Math.PI*2);
      ctx.fillStyle="#1e1b3a"; ctx.fill();
      ctx.beginPath(); ctx.arc(sunP.x,sunP.y,12,0,Math.PI*2);
      ctx.strokeStyle="#f59e0b"; ctx.lineWidth=2;
      ctx.shadowBlur=16; ctx.shadowColor="#f59e0b"; ctx.stroke(); ctx.shadowBlur=0;

      // ── sunset anchor (real local time) ──
      const moonA=m2a(sunsetMin); const moonP=polar(moonA,R);
      ctx.beginPath(); ctx.arc(moonP.x,moonP.y,12,0,Math.PI*2);
      ctx.fillStyle="#1e1b3a"; ctx.fill();
      ctx.beginPath(); ctx.arc(moonP.x,moonP.y,12,0,Math.PI*2);
      ctx.strokeStyle="#fb923c"; ctx.lineWidth=2; ctx.stroke();

      // ── current time dot ──
      const nowA=m2a(minutesInDay(now)); const nowP=polar(nowA,R);
      ctx.beginPath(); ctx.arc(nowP.x,nowP.y,6,0,Math.PI*2);
      ctx.fillStyle="#fff"; ctx.shadowBlur=12; ctx.shadowColor="#fff"; ctx.fill(); ctx.shadowBlur=0;

    },[sleeps,now,nextPred,sunriseMin,sunsetMin]);

    // ── HTML capsule pills along the arc ──
    const capsules=useMemo(()=>{
      const caps=[];
      const PILL_R=R+38;
      todaySleeps.forEach((s,i)=>{
        const sm=minutesInDay(s.start);
        const em=s.end?minutesInDay(s.end):minutesInDay(now);
        // If the session wraps past midnight (em < sm), treat em as em+1440 for the
        // midpoint math, then normalize back into 0-1440 range.
        const rawMid=em<sm ? (sm+em+1440)/2 : (sm+em)/2;
        const midMin=rawMid%1440;
        const midAngle=m2a(midMin);
        const {x,y}=polar(midAngle,PILL_R);
        const dur=s.end?s.end-s.start:now-s.start;
        caps.push({x,y,label:fmtTime(s.start),sublabel:fmtDur(dur),solid:true,active:!s.end});
      });
      return caps;
    },[sleeps,now,nextPred]);

    const activeDur=activeSleep?now-activeSleep.start:null;

    return(
      <div style={{position:"relative",width:SIZE,height:SIZE,margin:"0 auto",flexShrink:0}}>
        <canvas ref={canvasRef} style={{position:"absolute",top:0,left:0,borderRadius:"50%"}}/>
        {/* Capsule pills */}
        {capsules.map((cap,i)=>(
          <div key={i} style={{
            position:"absolute", left:cap.x, top:cap.y,
            transform:"translate(-50%,-50%)",
            background:"rgba(15,12,40,.88)",
            border:`1px ${cap.solid?"solid":"dashed"} ${cap.active?"rgba(167,139,250,.9)":"rgba(139,92,246,.5)"}`,
            borderRadius:999, padding:"4px 9px",
            display:"flex",flexDirection:"column",alignItems:"center",gap:1,
            pointerEvents:"none", backdropFilter:"blur(8px)",
            boxShadow:cap.active?"0 0 12px rgba(139,92,246,.4)":"none",
            minWidth:52,
          }}>
            <span style={{fontSize:9,color:"rgba(196,181,253,.5)"}}>🌙</span>
            <span style={{fontSize:10,fontWeight:700,color:cap.active?"#c4b5fd":"rgba(196,181,253,.7)",whiteSpace:"nowrap"}}>{cap.label}</span>
            <span style={{fontSize:9,color:"rgba(148,130,220,.6)",whiteSpace:"nowrap"}}>{cap.sublabel}</span>
          </div>
        ))}
        {/* Sunrise & sunset emoji labels (real local times) */}
        {(()=>{const sunA=m2a(sunriseMin);const {x,y}=polar(sunA,R);return<div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",fontSize:14,lineHeight:1,pointerEvents:"none"}}>☀️</div>;})()}
        {(()=>{const moonA=m2a(sunsetMin);const {x,y}=polar(moonA,R);return<div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",fontSize:14,lineHeight:1,pointerEvents:"none"}}>🌇</div>;})()}
        {/* Now dot label */}
        {(()=>{const a=m2a(minutesInDay(now));const {x,y}=polar(a,R+20);return<div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",fontSize:9,color:"rgba(255,255,255,.5)",whiteSpace:"nowrap",pointerEvents:"none"}}>{fmtTime(now)}</div>;})()}
        {/* Centre */}
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,padding:"0 40px"}}>
          {activeSleep?(
            <>
              <div style={{fontSize:11,color:"rgba(196,181,253,.6)",fontWeight:600,letterSpacing:".08em",textTransform:"uppercase"}}>{lang==="he"?"ישן עכשיו":"Sleeping now"}</div>
              <div style={{fontSize:42,fontWeight:900,color:"#fff",lineHeight:1,fontVariantNumeric:"tabular-nums",letterSpacing:"-.02em"}}>{fmtDurEn(activeDur)}</div>
              <button onClick={onToggle} style={{marginTop:10,padding:"8px 22px",background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:999,color:"#fff",fontSize:12,fontWeight:800,boxShadow:"0 0 24px rgba(99,102,241,.6)",letterSpacing:".02em"}}>
                {S.sleep.endSleep}
              </button>
            </>
          ):(
            <>
              {nextPred?(
                <>
                  <div style={{fontSize:11,color:"rgba(196,181,253,.55)",fontWeight:500,textAlign:"center",lineHeight:1.3}}>{lang==="he"?"שינה הבאה בעוד":"Next nap in"}</div>
                  <div style={{fontSize:46,fontWeight:900,color:"#fff",lineHeight:1,letterSpacing:"-.03em"}}>
                    {lang==="he"?fmtDur(nextPred.remaining*60000):fmtDurEn(nextPred.remaining*60000)}
                  </div>
                  <button onClick={onToggle} style={{marginTop:8,padding:"7px 20px",background:"rgba(99,102,241,.18)",border:"1px solid rgba(139,92,246,.4)",borderRadius:999,color:"#c4b5fd",fontSize:11,fontWeight:700}}>
                    {lang==="he"?"ישן עכשיו":"Sleep now"}
                  </button>
                </>
              ):(
                <>
                  <div style={{fontSize:12,color:"rgba(196,181,253,.45)",textAlign:"center",lineHeight:1.6,padding:"0 10px"}}>{lang==="he"?"לחץ להתחיל מעקב שינה":"Tap to start tracking sleep"}</div>
                  <button onClick={onToggle} style={{marginTop:10,padding:"9px 24px",background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:999,color:"#fff",fontSize:13,fontWeight:800,boxShadow:"0 0 24px rgba(99,102,241,.5)"}}>
                    {S.sleep.startSleep}
                  </button>
                </>
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  // ─── SLEEP TAB ───────────────────────────────────────────────────────────────
  function SleepTab({T,S,lang,sunTimes,sleeps:sleepsAll,setSleeps}){
    const[now,setNow]=useState(Date.now());
    useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),15000);return()=>clearInterval(t);},[]);
    useEffect(()=>saveLS("ww_sleeps",sleepsAll),[sleepsAll]);

    // Items pending an undoable delete are hidden from view but not yet
    // actually removed from sleepsAll/Firestore — everything below this
    // point keeps using the plain name "sleeps" unchanged.
    const[hiddenIds,setHiddenIds]=useState(()=>new Set());
    const pendingDeleteTimers=useRef({});
    const[undoToast,setUndoToast]=useState(null);
    const sleeps=useMemo(()=>sleepsAll.filter(s=>!hiddenIds.has(s.id)),[sleepsAll,hiddenIds]);
    useEffect(()=>()=>{Object.values(pendingDeleteTimers.current).forEach(clearTimeout);},[]);

    const activeSleep=sleeps.find(s=>!s.end);
    const todayStart=startOfDay(Date.now());

    // The "night sleep" is the last sleep that started before sunrise and is
    // classified as night — see computeMorningWake, shared with the
    // wake-window predictor below. Its wake time is the boundary for
    // "today's sleep". This is more meaningful for babies than a rigid
    // midnight cutoff, since a night sleep can start well before or after
    // midnight itself.
    const morningWakeTs=useMemo(()=>computeMorningWake(sleeps,now,sunTimes),[sleeps,now,sunTimes]);

    const todaySleeps=sleeps.filter(s=>s.start>=morningWakeTs);
    const totalTodayMs=todaySleeps.reduce((acc,s)=>{const dur=s.end?s.end-s.start:now-s.start;return acc+dur;},0);

    // Single next-wake-window prediction (State EWMA) — see
    // wake-window-estimator.js for the validated standalone version. Only
    // ever predicts the *next* transition, no multi-nap forecast.
    const nextSleepPred=useMemo(()=>{
      if(activeSleep||morningWakeTs===Infinity)return null;
      const allDays=buildSleepDays(sleeps,sunTimes);
      const todayKeyStr=dayKey(morningWakeTs);
      const history=allDays.filter(d=>d.dateKey!==todayKeyStr);
      const todayGroup=allDays.find(d=>d.dateKey===todayKeyStr);
      let cursor=morningWakeTs,estPrevDur=null;
      if(todayGroup)for(const nap of todayGroup.daySleeps){
        estPrevDur=WW_PARAMS.blend*((nap.end-nap.start)/60000)+(1-WW_PARAMS.blend)*WW_PARAMS.defaultNapDurMin;
        cursor=nap.end;
      }
      const predictedWW=ewmaFreeWW(history,todayKeyStr,estPrevDur,WW_PARAMS);
      const elapsed=Math.max(0,(now-cursor)/60000);
      return{remaining:Math.max(0,predictedWW-elapsed),predictedWW};
    },[sleeps,now,sunTimes,morningWakeTs,activeSleep]);

    const avgDurMs=useMemo(()=>{
      const finished=sleeps.filter(s=>s.end).slice(-14);
      if(!finished.length)return null;
      return finished.reduce((a,s)=>a+(s.end-s.start),0)/finished.length;
    },[sleeps]);

    const toggleSleep=()=>{
      haptic(activeSleep?12:15);
      if(activeSleep)setSleeps(prev=>prev.map(s=>s.id===activeSleep.id?{...s,end:Date.now(),updatedAt:Date.now()}:s));
      else {setSleeps(prev=>[...prev,{id:Date.now(),start:Date.now(),end:null,updatedAt:Date.now()}]);window.logAnalyticsEvent("record_added",{type:"sleep"});}
    };
    const deleteWithUndo=id=>{
      haptic(15);
      setHiddenIds(prev=>new Set(prev).add(id));
      pendingDeleteTimers.current[id]=setTimeout(()=>{
        setSleeps(prev=>prev.filter(s=>s.id!==id));
        setHiddenIds(prev=>{const n=new Set(prev);n.delete(id);return n;});
        delete pendingDeleteTimers.current[id];
      },3000);
      setUndoToast({
        message:lang==="he"?"הרשומה נמחקה":"Entry deleted",
        onAction:()=>{
          clearTimeout(pendingDeleteTimers.current[id]);
          delete pendingDeleteTimers.current[id];
          setHiddenIds(prev=>{const n=new Set(prev);n.delete(id);return n;});
        },
      });
    };
    const deleteSleep=id=>deleteWithUndo(id);
    const recentSleeps=[...sleeps].filter(s=>s.start>=todayStart-13*86400000).sort((a,b)=>b.start-a.start).slice(0,500);

    // ── Edit sheet state ──
    const[editSheetOpen,setEditSheetOpen]=useState(false);
    const[editId,setEditId]=useState(null);
    const[editStartDate,setEditStartDate]=useState("");
    const[editStartTime,setEditStartTime]=useState("");
    const[editEndDate,setEditEndDate]=useState("");
    const[editEndTime,setEditEndTime]=useState("");
    const[hasEnd,setHasEnd]=useState(true);
    const todayDateStr=tsToDateStr(now);

    // ── Read-only info popup (tap on a pattern-grid bar) ──
    const[infoSleep,setInfoSleep]=useState(null);
    const openInfoSleep=s=>{haptic(6);setInfoSleep(s);};

    const openEditSleep=s=>{
      haptic(8);
      setEditId(s.id);
      setEditStartDate(tsToDateStr(s.start)); setEditStartTime(tsToTimeStr(s.start));
      if(s.end){setHasEnd(true); setEditEndDate(tsToDateStr(s.end)); setEditEndTime(tsToTimeStr(s.end));}
      else{setHasEnd(false); setEditEndDate(tsToDateStr(now)); setEditEndTime(tsToTimeStr(now));}
      setEditSheetOpen(true);
    };
    // Quick-add: log a sleep that already happened without going through the
    // live start/stop toggle. Reuses the same sheet in create mode (editId
    // null) — Start and End both default to now, so both need adjusting.
    const openAddSleepSheet=()=>{
      haptic(10);
      setEditId(null);
      const n=Date.now();
      setEditStartDate(tsToDateStr(n)); setEditStartTime(tsToTimeStr(n));
      setHasEnd(true); setEditEndDate(tsToDateStr(n)); setEditEndTime(tsToTimeStr(n));
      setEditSheetOpen(true);
    };
    const saveEditSleep=()=>{
      haptic(12);
      const startTs=dateTimeToTs(editStartDate,editStartTime);
      const endTs=hasEnd?dateTimeToTs(editEndDate,editEndTime):null;
      if(editId){
        setSleeps(prev=>prev.map(s=>s.id===editId?{...s,start:startTs,end:(hasEnd&&endTs>startTs)?endTs:(hasEnd?s.end:null),updatedAt:Date.now(),conflict:false}:s));
      } else {
        setSleeps(prev=>[...prev,{id:Date.now(),start:startTs,end:(hasEnd&&endTs>startTs)?endTs:null,updatedAt:Date.now()}]);
        window.logAnalyticsEvent("record_added",{type:"sleep"});
      }
      setEditSheetOpen(false);
    };
    const deleteFromEditSheet=()=>{setEditSheetOpen(false);deleteWithUndo(editId);};

    return(
      <div style={{display:"flex",flexDirection:"column",gap:14,padding:"0 0 76px"}}>
        {/* Circular timeline hero */}
        <div style={{background:"linear-gradient(135deg,#0d0f2b,#151832)",borderRadius:16,padding:"20px 0 16px",border:"1px solid rgba(99,102,241,.2)",boxShadow:"0 8px 32px rgba(0,0,0,.4)"}}>
          <CircularTimeline sleeps={sleeps} activeSleep={activeSleep} nextPred={nextSleepPred} now={now} onToggle={toggleSleep} S={S} lang={lang} sunTimes={sunTimes} morningWakeTs={morningWakeTs}/>
          {/* Sunrise/sunset markers (real local times if available) */}
          <div style={{display:"flex",justifyContent:"center",gap:32,marginTop:12}}>
            <div style={{textAlign:"center"}}><div style={{fontSize:20}}>🌅</div><div style={{fontSize:11,color:"rgba(251,146,60,.8)",fontWeight:700,marginTop:2}}>{sunTimes?fmtTime(startOfDay(Date.now())+sunTimes.sunriseMin*60000):"06:00"}</div></div>
            <div style={{textAlign:"center"}}><div style={{fontSize:20}}>🌇</div><div style={{fontSize:11,color:"rgba(251,146,60,.8)",fontWeight:700,marginTop:2}}>{sunTimes?fmtTime(startOfDay(Date.now())+sunTimes.sunsetMin*60000):"20:00"}</div></div>
          </div>
          {/* Naïve prediction note */}
          <div style={{textAlign:"center",fontSize:10,color:"rgba(165,180,252,.35)",marginTop:8,padding:"0 20px"}}>{S.sleep.naiveNote}</div>
        </div>

        {/* Stats row */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <StatCard icon="🌙" label={S.sleep.totalToday} value={totalTodayMs>0?fmtDur(totalTodayMs):"—"} sub={avgDurMs?`${S.sleep.avgDuration}: ${fmtDur(avgDurMs)}`:""} T={T}/>
          <StatCard icon="📊" label={S.sleep.nextSleep} value={nextSleepPred?(lang==="he"?fmtDur(nextSleepPred.remaining*60000):fmtDurEn(nextSleepPred.remaining*60000)):"—"} sub={S.sleep.naiveNote} T={T}/>
        </div>

        {/* 7-day pattern */}
        <PatternGrid events={sleeps} color={T.sleepColor} bgColor={T.sleepBg} T={T} S={S} type="sleep" onSelect={openInfoSleep} selectedId={infoSleep?.id}/>

        {/* History — grouped by day, collapsible */}
        <div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:recentSleeps.length?10:0}}>
            <div style={{fontSize:12,fontWeight:700,color:T.sub}}>{S.sleep.history}</div>
            {recentSleeps.length>0&&<div style={{fontSize:10,color:T.muted}}>{lang==="he"?"לחץ לעריכה":"Tap to edit"}</div>}
          </div>
          {recentSleeps.length===0
            ?<EmptyState Icon={IconMoonZzz} accent={T.sleepColor} T={T} text={S.sleep.noSleeps}/>
            :(()=>{
                const groups=[];
                const map={};
                recentSleeps.forEach(s=>{
                  const dayStart=sunriseDayStart(s.start,sunTimes?.sunriseMin);
                  const k=dayKey(dayStart);
                  if(!(k in map)){map[k]={dayStart,entries:[]};groups.push(map[k]);}
                  map[k].entries.push(s);
                });
                return<div style={{display:"flex",flexDirection:"column",gap:2}}>
                  {groups.map((g,gi)=>{
                    const c=DAY_COLORS[gi%DAY_COLORS.length];
                    const totalMs=g.entries.reduce((acc,s)=>acc+(s.end?s.end-s.start:now-s.start),0);
                    const n=g.entries.length;
                    const countLabel=lang==="he"?`${n} ${n===1?"שינה":"שינות"}`:`${n} ${n===1?"sleep":"sleeps"}`;
                    return(
                      <DayGroup key={dayKey(g.dayStart)} T={T} dayStart={g.dayStart} lang={lang} accent={c} defaultOpen={gi===0} summary={`${countLabel} · ${fmtDur(totalMs)}`}>
                        {g.entries.map(s=>(
                          <SwipeableRow key={s.id} T={T} deleteLabel={S.sleep.delete} onDelete={()=>deleteSleep(s.id)} onTap={()=>openEditSleep(s)}>
                            <SleepRow s={s} now={now} T={T} S={S} lang={lang} dayColor={c}/>
                          </SwipeableRow>
                        ))}
                      </DayGroup>
                    );
                  })}
                </div>;
              })()}
        </div>

        {/* Edit sleep bottom sheet */}
        <BottomSheet open={editSheetOpen} onClose={()=>setEditSheetOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:16,textAlign:"center"}}>{editId?(lang==="he"?"עריכת שינה":"Edit Sleep"):(lang==="he"?"הוספת שינה":"Add Sleep")}</div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>🕐 {lang==="he"?"התחלה":"Start"}</div>
            <DateTimeField dateStr={editStartDate} timeStr={editStartTime} onDateChange={setEditStartDate} onTimeChange={setEditStartTime} T={T} lang={lang} maxDate={todayDateStr}/>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{fontSize:11,fontWeight:700,color:T.sub}}>🕐 {lang==="he"?"סיום":"End"}</div>
              <button onClick={()=>{haptic(6);setHasEnd(h=>!h);}} style={{fontSize:11,fontWeight:700,color:hasEnd?T.sub:T.accentText,background:"none",padding:"2px 4px"}}>
                {hasEnd?(lang==="he"?"עדיין ישן?":"Still sleeping?"):"✓ "+(lang==="he"?"עדיין ישן":"Still sleeping")}
              </button>
            </div>
            {hasEnd&&<DateTimeField dateStr={editEndDate} timeStr={editEndTime} onDateChange={setEditEndDate} onTimeChange={setEditEndTime} T={T} lang={lang} maxDate={todayDateStr}/>}
          </div>
          <div style={{display:"flex",gap:8}}>
            {editId&&<button onClick={deleteFromEditSheet} aria-label={S.sleep.delete} style={{padding:"0 18px",background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IconTrash size={17} color="#ef4444"/>
            </button>}
            <button onClick={saveEditSleep} style={{flex:1,padding:14,background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:16,color:"#fff",fontSize:15,fontWeight:800,boxShadow:"0 4px 20px rgba(99,102,241,.4)"}}>{lang==="he"?"שמור":"Save"}</button>
          </div>
        </BottomSheet>

        {/* Read-only info popup for pattern-grid taps */}
        <BottomSheet open={!!infoSleep} onClose={()=>setInfoSleep(null)} T={T}>
          {infoSleep&&(()=>{
            const dur=infoSleep.end?infoSleep.end-infoSleep.start:now-infoSleep.start;
            return<div style={{textAlign:"center",padding:"4px 0 6px"}}>
              <div style={{fontSize:32,marginBottom:8}}>🌙</div>
              <div style={{marginBottom:8,display:"flex",justifyContent:"center"}}>
                {infoSleep.end
                  ?<TimeRangeBadge start={infoSleep.start} end={infoSleep.end} color={T.sleepColor} T={T} large/>
                  :<div style={{fontSize:18,fontWeight:800,color:T.text}}>{fmtTime(infoSleep.start)} · {lang==="he"?"ישן עכשיו":"sleeping now"}</div>}
              </div>
              <div style={{fontSize:14,color:T.sub,marginBottom:4}}>{S.sleep.duration}: {fmtDur(dur)}</div>
              {infoSleep.conflict&&<div style={{fontSize:12,color:"#ef4444",fontWeight:700,marginBottom:4}}>🚩 {lang==="he"?"חופף לשינה אחרת — נא לבדוק":"Overlaps another sleep — please review"}</div>}
              <div style={{fontSize:12,color:T.muted}}>{new Date(infoSleep.start).toLocaleDateString(lang==="he"?"he-IL":"en-US",{weekday:"long",day:"numeric",month:"short"})}</div>
            </div>;
          })()}
        </BottomSheet>

        {/* Quick-add FAB — log a sleep that already happened, without the live start/stop toggle */}
        <button onClick={openAddSleepSheet} aria-label={lang==="he"?"הוספת שינה":"Add Sleep"} style={{position:"fixed",bottom:"calc(90px + env(safe-area-inset-bottom,0px))",insetInlineEnd:20,zIndex:200,width:56,height:56,borderRadius:"50%",background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 6px 24px rgba(99,102,241,.45)"}}>
          <IconPlus size={24}/>
        </button>

        {undoToast&&<Toast message={undoToast.message} type="error" duration={3000} actionLabel={lang==="he"?"בטל":"Undo"} onAction={undoToast.onAction} onDone={()=>setUndoToast(null)}/>}
      </div>
    );
  }

  // ─── TIME RANGE BADGE (start + end shown as two skewed, seamed chips instead
  // of an arrow character — the diagonal seam reads as "flows into", and since
  // it's pure shapes/CSS it never gets flipped by RTL bidi mirroring the way a
  // ← / → glyph does. Direction is forced to ltr just for this small chip so
  // start always renders before end, regardless of the app language.) ────────
  function TimeRangeBadge({start,end,color,T,large}){
    const h=large?32:21;
    const fs=large?15:12;
    const pad=large?"0 12px":"0 8px";
    const skew=large?9:11;
    return(
      <div style={{display:"inline-flex",height:h,borderRadius:large?12:8,overflow:"hidden",direction:"ltr",flexShrink:0}}>
        <div style={{transform:`skewX(-${skew}deg)`,marginRight:large?-9:-5,background:`${color}28`,display:"flex",alignItems:"center",padding:pad}}>
          <span style={{display:"inline-block",transform:`skewX(${skew}deg)`,fontSize:fs,fontWeight:800,color:T.text,whiteSpace:"nowrap"}}>{fmtTime(start)}</span>
        </div>
        <div style={{transform:`skewX(-${skew}deg)`,background:`${color}45`,display:"flex",alignItems:"center",padding:pad}}>
          <span style={{display:"inline-block",transform:`skewX(${skew}deg)`,fontSize:fs,fontWeight:800,color:T.text,whiteSpace:"nowrap"}}>{end?fmtTime(end):"…"}</span>
        </div>
      </div>
    );
  }

  function SleepRow({s,now,T,S,lang,dayColor}){
    const dur=s.end?s.end-s.start:now-s.start;
    const isActive=!s.end;
    const c=dayColor||"#6366f1";
    return<div style={{display:"flex",alignItems:"center",gap:11,padding:"9px 10px"}}>
      <div style={{width:32,height:32,borderRadius:12,background:`${c}22`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:isActive?`0 0 0 2px ${c}88`:"none"}}>
        <IconMoonZzz size={15} color={c}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13.5,fontWeight:700,color:T.text}}>
          {s.end?<TimeRangeBadge start={s.start} end={s.end} color={c} T={T}/>:<>
            <span>{fmtTime(s.start)}</span>
            <span style={{color:"#818cf8",fontWeight:600,fontSize:12}}>{lang==="he"?"ישן עכשיו":"sleeping now"}</span>
          </>}
          <span style={{fontSize:11,color:T.sub,fontWeight:500,marginInlineStart:"auto"}}>{fmtDur(dur)}</span>
        </div>
        <div style={{fontSize:11,color:T.sub,marginTop:1,display:"flex",alignItems:"center",gap:5}}>
          <span>{new Date(s.start).toLocaleDateString(lang==="he"?"he-IL":"en-US",{day:"numeric",month:"short"})}</span>
          {s.conflict&&<span title={lang==="he"?"חופף לשינה אחרת — נא לבדוק":"Overlaps another sleep — please review"} style={{color:"#ef4444",fontWeight:700,fontSize:10.5}}>🚩 {lang==="he"?"חופף":"Overlap"}</span>}
        </div>
      </div>
    </div>;
  }

  // ─── FEED TAB ────────────────────────────────────────────────────────────────
  function FeedTab({T,S,lang,feeds:feedsAll,setFeeds,weights}){
    const[sheetOpen,setSheetOpen]=useState(false);
    const[editingId,setEditingId]=useState(null); // null = adding new
    const[feedType,setFeedType]=useState("breast");
    const[feedAmt,setFeedAmt]=useState("");
    const[feedPrepared,setFeedPrepared]=useState("");
    const[feedNote,setFeedNote]=useState("");
    const[feedDate,setFeedDate]=useState(()=>tsToDateStr(Date.now()));
    const[feedTimeOnly,setFeedTimeOnly]=useState(()=>tsToTimeStr(Date.now()));
    // Sittings being edited for an existing bottle: [{id,timeStr,amount}].
    // Only populated when editingId && feedType==="bottle" — a fresh bottle
    // (no editingId) still uses the plain Prepared+Consumed fields above.
    const[sittingsDraft,setSittingsDraft]=useState([]);
    const draftFromSitting=s=>({id:s.id!=null?String(s.id):crypto.randomUUID(),timeStr:tsToTimeStr(s.start),amount:s.amount!=null?String(s.amount):""});

    // ── Read-only info popup (tap on a pattern-grid dot) ──
    const[infoFeed,setInfoFeed]=useState(null);
    const openInfoFeed=f=>{haptic(6);setInfoFeed(f);};

    useEffect(()=>saveLS("ww_feeds",feedsAll),[feedsAll]);

    // Items pending an undoable delete are hidden from view but not yet
    // actually removed from feedsAll/Firestore.
    const[hiddenIds,setHiddenIds]=useState(()=>new Set());
    const pendingDeleteTimers=useRef({});
    const[undoToast,setUndoToast]=useState(null);
    const feeds=useMemo(()=>feedsAll.filter(f=>!hiddenIds.has(f.id)),[feedsAll,hiddenIds]);
    useEffect(()=>()=>{Object.values(pendingDeleteTimers.current).forEach(clearTimeout);},[]);

    const todayStart=startOfDay(Date.now());
    const todayFeeds=feeds.filter(f=>f.start>=todayStart);
    const recentFeeds=[...feeds].filter(f=>f.start>=todayStart-13*86400000).sort((a,b)=>b.start-a.start).slice(0,500);
    const lastFeed=recentFeeds[0];

    // Avg interval prediction
    const avgIntervalMs=useMemo(()=>{
      const sorted=[...feeds].sort((a,b)=>a.start-b.start);
      if(sorted.length<2)return null;
      const intervals=[];
      for(let i=1;i<Math.min(sorted.length,10);i++)intervals.push(sorted[i].start-sorted[i-1].start);
      return intervals.reduce((a,b)=>a+b,0)/intervals.length;
    },[feeds]);

    const nextFeedIn=lastFeed&&avgIntervalMs?Math.max(0,Math.round((lastFeed.start+avgIntervalMs-Date.now())/60000)):null;

    // Bottle consumption vs recommended daily target: min(150ml * weightKg, 960ml)
    const latestWeightKg=useMemo(()=>{
      if(!weights.length)return null;
      return[...weights].sort((a,b)=>b.date-a.date)[0].kg;
    },[weights]);
    // Daily total is the one place that sums by each SITTING's own timestamp,
    // not the record's — a sitting logged just now counts today even if the
    // bottle was prepared yesterday. So this scans `feeds`, not `todayFeeds`.
    const bottleTodayMl=useMemo(()=>feeds.reduce((total,f)=>{
      if(f.type!=="bottle")return total;
      return total+bottleSittingsOf(f).filter(s=>s.start>=todayStart).reduce((a,s)=>a+(s.amount||0),0);
    },0),[feeds,todayStart]);
    const recommendedMl=latestWeightKg?Math.min(150*latestWeightKg,960):null;

    const openAddSheet=()=>{
      haptic(10);
      setEditingId(null); setFeedType("breast"); setFeedAmt(""); setFeedPrepared(""); setFeedNote(""); setSittingsDraft([]);
      setFeedDate(tsToDateStr(Date.now())); setFeedTimeOnly(tsToTimeStr(Date.now()));
      setSheetOpen(true);
    };
    const openEditSheet=f=>{
      haptic(8);
      setEditingId(f.id); setFeedType(f.type); setFeedAmt(f.amount?String(f.amount):""); setFeedPrepared(f.prepared?String(f.prepared):""); setFeedNote(f.note||"");
      setFeedDate(tsToDateStr(f.start)); setFeedTimeOnly(tsToTimeStr(f.start));
      setSittingsDraft(f.type==="bottle"?bottleSittingsOf(f).map(draftFromSitting):[]);
      setSheetOpen(true);
    };
    // Row-level quick-add (§3 discoverability): opens the same edit sheet as
    // openEditSheet, but with a new empty sitting already appended and ready
    // to fill in — no need to dig into the sheet to add one.
    const openQuickAddSitting=f=>{
      haptic(8);
      setEditingId(f.id); setFeedType("bottle"); setFeedAmt(""); setFeedPrepared(f.prepared?String(f.prepared):""); setFeedNote(f.note||"");
      setFeedDate(tsToDateStr(f.start)); setFeedTimeOnly(tsToTimeStr(f.start));
      setSittingsDraft([...bottleSittingsOf(f).map(draftFromSitting),{id:crypto.randomUUID(),timeStr:tsToTimeStr(Date.now()),amount:""}]);
      setSheetOpen(true);
    };
    const addSittingRow=()=>{haptic(6);setSittingsDraft(prev=>[...prev,{id:crypto.randomUUID(),timeStr:tsToTimeStr(Date.now()),amount:""}]);};
    const removeSittingRow=sid=>{haptic(10);setSittingsDraft(prev=>prev.length>1?prev.filter(s=>s.id!==sid):prev);};
    const updateSittingTime=(sid,val)=>setSittingsDraft(prev=>prev.map(s=>s.id===sid?{...s,timeStr:val}:s));
    // Clamp to remaining capacity (prepared − every OTHER sitting's amount) as
    // the person types, so it's structurally impossible to save over prepared.
    const updateSittingAmount=(sid,val)=>{
      setSittingsDraft(prev=>{
        if(val===""||!feedPrepared)return prev.map(s=>s.id===sid?{...s,amount:val}:s);
        const preparedNum=parseInt(feedPrepared)||0;
        const othersSum=prev.filter(s=>s.id!==sid).reduce((a,s)=>a+(parseInt(s.amount)||0),0);
        const remaining=Math.max(0,preparedNum-othersSum);
        const clamped=Math.max(0,Math.min(parseInt(val)||0,remaining));
        return prev.map(s=>s.id===sid?{...s,amount:String(clamped)}:s);
      });
    };
    // Same clamp for the single Consumed field on the new-bottle creation flow.
    const updateConsumed=val=>{
      if(val===""||!feedPrepared){setFeedAmt(val);return;}
      const preparedNum=parseInt(feedPrepared)||0;
      setFeedAmt(String(Math.max(0,Math.min(parseInt(val)||0,preparedNum))));
    };
    const saveFeed=()=>{
      haptic(15);
      const ts=dateTimeToTs(feedDate,feedTimeOnly);
      const prep=feedPrepared?parseInt(feedPrepared):null;
      const note=feedNote.trim()?feedNote.trim():null;

      if(feedType==="bottle"&&editingId&&sittingsDraft.length){
        const sittings=sittingsDraft
          .map(s=>({id:s.id,start:dateTimeToTs(feedDate,s.timeStr),amount:s.amount!==""?parseInt(s.amount):null}))
          .sort((a,b)=>a.start-b.start);
        const latestStart=sittings[sittings.length-1].start; // record.start tracks the latest sitting, not creation time
        setFeeds(prev=>prev.map(f=>f.id===editingId?{...f,type:"bottle",prepared:prep,amount:null,sittings,note,start:latestStart,updatedAt:Date.now()}:f));
        setSheetOpen(false);
        return;
      }

      const amt=feedAmt?parseInt(feedAmt):null;
      if(feedType==="bottle"&&!editingId){
        const sittings=[{id:crypto.randomUUID(),start:ts,amount:amt}];
        setFeeds(prev=>[...prev,{id:Date.now(),start:ts,type:"bottle",prepared:prep,amount:null,sittings,note,updatedAt:Date.now()}]);
        window.logAnalyticsEvent("record_added",{type:"feed"});
        setSheetOpen(false);
        return;
      }

      if(editingId)setFeeds(prev=>prev.map(f=>f.id===editingId?{...f,type:feedType,amount:amt,prepared:prep,note,start:ts,updatedAt:Date.now()}:f));
      else {setFeeds(prev=>[...prev,{id:Date.now(),start:ts,type:feedType,amount:amt,prepared:prep,note,updatedAt:Date.now()}]);window.logAnalyticsEvent("record_added",{type:"feed"});}
      setSheetOpen(false);
    };
    const deleteWithUndo=id=>{
      haptic(15);
      setHiddenIds(prev=>new Set(prev).add(id));
      pendingDeleteTimers.current[id]=setTimeout(()=>{
        setFeeds(prev=>prev.filter(f=>f.id!==id));
        setHiddenIds(prev=>{const n=new Set(prev);n.delete(id);return n;});
        delete pendingDeleteTimers.current[id];
      },3000);
      setUndoToast({
        message:lang==="he"?"הרשומה נמחקה":"Entry deleted",
        onAction:()=>{
          clearTimeout(pendingDeleteTimers.current[id]);
          delete pendingDeleteTimers.current[id];
          setHiddenIds(prev=>{const n=new Set(prev);n.delete(id);return n;});
        },
      });
    };
    const deleteFeed=id=>deleteWithUndo(id);
    const deleteFromSheet=()=>{setSheetOpen(false);deleteWithUndo(editingId);};

    // §6 warning: earliest sitting among the CURRENT drafted sittings,
    // recomputed live as times are edited (not fixed to whichever was first).
    const firstSittingTs=sittingsDraft.length?Math.min(...sittingsDraft.map(s=>dateTimeToTs(feedDate,s.timeStr))):null;

    const typeEmoji={breast:"🤱",bottle:"🍼",solid:"🥣"};
    const todayDateStr=tsToDateStr(Date.now());

    return(
      <div style={{display:"flex",flexDirection:"column",gap:12,padding:"0 0 76px"}}>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <StatCard icon="⏭️" label={S.feed.nextFeed} value={nextFeedIn!==null?(nextFeedIn<60?nextFeedIn+"ד׳":Math.round(nextFeedIn/60)+"ש׳"):"—"} sub={lastFeed?`${lang==="he"?"אחרון":"Last"}: ${fmtTime(lastFeed.start)}`:"—"} T={T}/>
          <StatCard icon="📊" label={S.feed.totalToday} value={todayFeeds.length.toString()} sub={avgIntervalMs?`${S.feed.avgInterval}: ${fmtDur(avgIntervalMs)}`:"—"} T={T}/>
        </div>

        {/* Bottle consumption today (target shown only if weight is known) */}
        <div style={{background:T.surface,borderRadius:16,padding:"13px 16px",border:`1px solid ${T.surfaceB}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:recommendedMl?8:0}}>
            <div style={{fontSize:11,fontWeight:700,color:T.sub}}>🍼 {S.feed.bottleToday}</div>
            <div style={{fontSize:13,fontWeight:800,color:T.text}}>{bottleTodayMl}{recommendedMl?` / ${Math.round(recommendedMl)}`:""} {lang==="he"?"מ״ל":"ml"}</div>
          </div>
          {recommendedMl?(
            <div style={{background:"rgba(128,128,128,.15)",borderRadius:999,height:7,overflow:"hidden"}}>
              <div style={{width:`${Math.min(100,(bottleTodayMl/recommendedMl)*100)}%`,height:"100%",borderRadius:999,background:bottleTodayMl>=recommendedMl?"linear-gradient(90deg,#22c55e,#16a34a)":"linear-gradient(90deg,#fb923c,#f97316)",transition:"width .4s"}}/>
            </div>
          ):(
            <div style={{fontSize:11,color:T.muted,lineHeight:1.5,marginTop:4}}>{S.feed.addWeightHint}</div>
          )}
        </div>

        {/* Pattern grid */}
        <PatternGrid events={feeds} color={T.feedColor} bgColor={T.feedBg} T={T} S={S} type="feed" onSelect={openInfoFeed} selectedId={infoFeed?.id}/>

        {/* History — grouped by day, collapsible */}
        <div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:recentFeeds.length?10:0}}>
            <div style={{fontSize:12,fontWeight:700,color:T.sub}}>{S.feed.history}</div>
            {recentFeeds.length>0&&<div style={{fontSize:10,color:T.muted}}>{lang==="he"?"לחץ לעריכה":"Tap to edit"}</div>}
          </div>
          {recentFeeds.length===0
            ?<EmptyState Icon={IconBottle} accent={T.feedColor} T={T} text={S.feed.noFeeds}/>
            :(()=>{
                const groups=[];
                const map={};
                recentFeeds.forEach(f=>{
                  const k=dayKey(f.start);
                  if(!(k in map)){map[k]={dayStart:startOfDay(f.start),entries:[]};groups.push(map[k]);}
                  map[k].entries.push(f);
                });
                return<div style={{display:"flex",flexDirection:"column",gap:2}}>
                  {groups.map((g,gi)=>{
                    const c=DAY_COLORS[gi%DAY_COLORS.length];
                    const n=g.entries.length;
                    const countLabel=lang==="he"?`${n} ${n===1?"ארוחה":"ארוחות"}`:`${n} ${n===1?"feed":"feeds"}`;
                    return(
                      <DayGroup key={dayKey(g.dayStart)} T={T} dayStart={g.dayStart} lang={lang} accent={c} defaultOpen={gi===0} summary={countLabel}>
                        {g.entries.map(f=>(
                          <SwipeableRow key={f.id} T={T} deleteLabel={S.feed.delete} onDelete={()=>deleteFeed(f.id)} onTap={()=>openEditSheet(f)}>
                            <FeedRow f={f} T={T} S={S} typeEmoji={typeEmoji} lang={lang} dayColor={c} onQuickAdd={openQuickAddSitting}/>
                          </SwipeableRow>
                        ))}
                      </DayGroup>
                    );
                  })}
                </div>;
              })()}
        </div>

        {/* Add / edit feed bottom sheet */}
        <BottomSheet open={sheetOpen} onClose={()=>setSheetOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:16,textAlign:"center"}}>
            {editingId?(lang==="he"?"עריכת ארוחה":"Edit Feed"):S.feed.logFeed}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {Object.entries(S.feed.types).map(([k,v])=>(
              <button key={k} onClick={()=>{haptic(8);setFeedType(k);if(editingId&&k==="bottle"&&sittingsDraft.length===0)setSittingsDraft([{id:crypto.randomUUID(),timeStr:feedTimeOnly,amount:""}]);}} style={{flex:1,padding:"12px 0",background:feedType===k?"linear-gradient(135deg,#f97316,#ea580c)":T.surface2,border:`1px solid ${feedType===k?"#f97316":T.surface2B}`,borderRadius:12,color:feedType===k?"#fff":T.text,fontSize:13,fontWeight:700}}>
                <div style={{fontSize:20,marginBottom:2}}>{typeEmoji[k]}</div>{v}
              </button>
            ))}
          </div>
          {feedType==="bottle"&&!editingId&&(
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>{S.feed.prepared}</div>
                <input type="number" inputMode="numeric" placeholder="0" value={feedPrepared} onChange={e=>setFeedPrepared(e.target.value)}
                  style={{width:"100%",padding:"11px 10px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:16,fontWeight:700,outline:"none",textAlign:"center"}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{fontSize:11,fontWeight:700,color:T.sub}}>{S.feed.consumed}</div>
                  {feedPrepared&&<button onClick={()=>{haptic(6);setFeedAmt(feedPrepared);}} style={{fontSize:9.5,fontWeight:700,color:T.feedColor,background:"none",padding:"0 2px"}}>{S.feed.finishedAll}</button>}
                </div>
                <input type="number" inputMode="numeric" placeholder="0" value={feedAmt} onChange={e=>updateConsumed(e.target.value)}
                  style={{width:"100%",padding:"11px 10px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:16,fontWeight:700,outline:"none",textAlign:"center"}}/>
              </div>
            </div>
          )}
          {feedType==="bottle"&&editingId&&(
            <div style={{marginBottom:14}}>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>{S.feed.prepared}</div>
                <input type="number" inputMode="numeric" placeholder="0" value={feedPrepared} onChange={e=>setFeedPrepared(e.target.value)}
                  style={{width:"100%",padding:"11px 10px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:16,fontWeight:700,outline:"none",textAlign:"center"}}/>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {sittingsDraft.map(s=>{
                  const isLate=firstSittingTs!=null&&(dateTimeToTs(feedDate,s.timeStr)-firstSittingTs)>3600000;
                  return(
                    <div key={s.id}>
                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        <input type="time" value={s.timeStr} onChange={e=>updateSittingTime(s.id,e.target.value)}
                          style={{flex:1,padding:"10px 8px",background:T.input,border:`1px solid ${isLate?"#f59e0b":T.inputB}`,borderRadius:12,color:T.inputText,fontSize:15,fontWeight:700,outline:"none",colorScheme:T.ds,textAlign:"center"}}/>
                        <input type="number" inputMode="numeric" placeholder="0" value={s.amount} onChange={e=>updateSittingAmount(s.id,e.target.value)}
                          style={{flex:1,padding:"10px 8px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:15,fontWeight:700,outline:"none",textAlign:"center"}}/>
                        <button onClick={()=>removeSittingRow(s.id)} disabled={sittingsDraft.length===1} aria-label={lang==="he"?"הסר מנה":"Remove sitting"} style={{flexShrink:0,padding:"9px 10px",background:sittingsDraft.length===1?"rgba(128,128,128,.12)":"rgba(239,68,68,.12)",border:`1px solid ${sittingsDraft.length===1?"transparent":"rgba(239,68,68,.3)"}`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",opacity:sittingsDraft.length===1?.4:1}}>
                          <IconTrash size={14} color={sittingsDraft.length===1?T.sub:"#ef4444"}/>
                        </button>
                      </div>
                      {isLate&&<div style={{fontSize:10.5,color:"#f59e0b",marginTop:4,paddingInlineStart:2}}>⚠️ {lang==="he"?"יותר משעה אחרי המנה הראשונה":"More than 1 hour after the first sitting"}</div>}
                    </div>
                  );
                })}
                <button onClick={addSittingRow} style={{padding:"10px 0",background:T.surface2,border:`1px dashed ${T.surface2B}`,borderRadius:12,color:T.feedColor,fontSize:12.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                  <IconPlus size={14} color={T.feedColor}/>{lang==="he"?"הוסף מנה":"Add Sitting"}
                </button>
              </div>
            </div>
          )}
          {feedType==="solid"&&(
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>{lang==="he"?"הערה (אופציונלי)":"Note (optional)"}</div>
              <input type="text" placeholder={lang==="he"?"למשל: אבוקדו, פעם ראשונה!":"e.g. avocado, first time!"} value={feedNote} onChange={e=>setFeedNote(e.target.value)}
                style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:14,outline:"none"}}/>
            </div>
          )}
          {feedType==="bottle"&&editingId?(
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>📅 {lang==="he"?"תאריך":"Date"}</div>
              <input type="date" value={feedDate} max={todayDateStr} onChange={e=>setFeedDate(e.target.value)}
                style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:15,outline:"none",colorScheme:T.ds}}/>
            </div>
          ):(
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>🕐 {lang==="he"?"שעה":"Time"}</div>
              <DateTimeField dateStr={feedDate} timeStr={feedTimeOnly} onDateChange={setFeedDate} onTimeChange={setFeedTimeOnly} T={T} lang={lang} maxDate={todayDateStr}/>
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            {editingId&&<button onClick={deleteFromSheet} aria-label={S.feed.delete} style={{padding:"0 18px",background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IconTrash size={17} color="#ef4444"/>
            </button>}
            <button onClick={saveFeed} style={{flex:1,padding:14,background:"linear-gradient(135deg,#f97316,#ea580c)",border:"none",borderRadius:16,color:"#fff",fontSize:15,fontWeight:800,boxShadow:"0 4px 20px rgba(249,115,22,.4)"}}>{S.feed.save}</button>
          </div>
        </BottomSheet>

        {/* Read-only info popup for pattern-grid taps */}
        <BottomSheet open={!!infoFeed} onClose={()=>setInfoFeed(null)} T={T}>
          {infoFeed&&(()=>{
            const isBottle=infoFeed.type==="bottle";
            const totalMl=isBottle?bottleTotalMl(infoFeed):null;
            const sittingsCount=isBottle?bottleSittingsOf(infoFeed).length:1;
            const hasBoth=isBottle?(infoFeed.prepared&&totalMl&&infoFeed.prepared!==totalMl):(infoFeed.prepared&&infoFeed.amount&&infoFeed.prepared!==infoFeed.amount);
            const singleMl=isBottle?(totalMl||infoFeed.prepared||null):(infoFeed.amount??infoFeed.prepared);
            const consumedMl=isBottle?totalMl:infoFeed.amount;
            return<div style={{textAlign:"center",padding:"4px 0 6px"}}>
              <div style={{fontSize:32,marginBottom:8}}>{typeEmoji[infoFeed.type]||"🍼"}</div>
              <div style={{fontSize:18,fontWeight:800,color:T.text,marginBottom:6}}>{fmtTime(infoFeed.start)} · {S.feed.types[infoFeed.type]}</div>
              {singleMl?<div style={{fontSize:14,color:T.sub,marginBottom:4}}>{hasBoth?`${consumedMl}/${infoFeed.prepared} ${lang==="he"?"מ״ל":"ml"}`:`${singleMl} ${lang==="he"?"מ״ל":"ml"}`}</div>:null}
              {sittingsCount>1&&<div style={{fontSize:12,color:T.muted,marginBottom:4}}>{sittingsCount} {lang==="he"?"מנות":"sittings"}</div>}
              {infoFeed.note&&<div style={{fontSize:13,color:T.muted,fontStyle:"italic",marginBottom:4}}>"{infoFeed.note}"</div>}
              <div style={{fontSize:12,color:T.muted}}>{new Date(infoFeed.start).toLocaleDateString(lang==="he"?"he-IL":"en-US",{weekday:"long",day:"numeric",month:"short"})}</div>
            </div>;
          })()}
        </BottomSheet>

        {/* Log Feed FAB — reachable regardless of scroll position, docked above the tab bar */}
        <button onClick={openAddSheet} aria-label={S.feed.logFeed} style={{position:"fixed",bottom:"calc(90px + env(safe-area-inset-bottom,0px))",insetInlineEnd:20,zIndex:200,width:56,height:56,borderRadius:"50%",background:"linear-gradient(135deg,#f97316,#ea580c)",border:"none",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 6px 24px rgba(249,115,22,.45)"}}>
          <IconPlus size={24}/>
        </button>

        {undoToast&&<Toast message={undoToast.message} type="error" duration={3000} actionLabel={lang==="he"?"בטל":"Undo"} onAction={undoToast.onAction} onDone={()=>setUndoToast(null)}/>}
      </div>
    );
  }

  function FeedRow({f,T,S,typeEmoji,lang,dayColor,onQuickAdd}){
    const[expanded,setExpanded]=useState(false);
    const isBottle=f.type==="bottle";
    const sittings=isBottle?bottleSittingsOf(f):null;
    const totalMl=isBottle?bottleTotalMl(f):null;
    const multiSitting=isBottle&&sittings.length>1;
    const hasBoth=isBottle?(f.prepared&&totalMl&&f.prepared!==totalMl):(f.prepared&&f.amount&&f.prepared!==f.amount);
    const singleMl=isBottle?(totalMl||f.prepared||null):(f.amount??f.prepared);
    const consumedMl=isBottle?totalMl:f.amount;
    const finished=isBottle?(f.prepared&&totalMl>=f.prepared):(f.prepared&&f.amount&&f.amount>=f.prepared);
    const c=dayColor||"#f97316";
    const toggleExpand=e=>{e.stopPropagation();haptic(6);setExpanded(v=>!v);};

  // ─── WEIGHT SECTION (baby weight tracking for feed-target calculations) ────
  function WeightSection({T,S,lang,weights:weightsAll,setWeights}){
    const[sheetOpen,setSheetOpen]=useState(false);
    const[editingId,setEditingId]=useState(null);
    const[wKg,setWKg]=useState("");
    const[wDate,setWDate]=useState(()=>tsToDateStr(Date.now()));

    useEffect(()=>saveLS("ww_weights",weightsAll),[weightsAll]);

    // Items pending an undoable delete are hidden from view but not yet
    // actually removed from weightsAll/Firestore.
    const[hiddenIds,setHiddenIds]=useState(()=>new Set());
    const pendingDeleteTimers=useRef({});
    const[undoToast,setUndoToast]=useState(null);
    const weights=useMemo(()=>weightsAll.filter(w=>!hiddenIds.has(w.id)),[weightsAll,hiddenIds]);
    useEffect(()=>()=>{Object.values(pendingDeleteTimers.current).forEach(clearTimeout);},[]);

    const sorted=useMemo(()=>[...weights].sort((a,b)=>b.date-a.date),[weights]);
    const sparkData=useMemo(()=>[...weights].sort((a,b)=>a.date-b.date),[weights]);
    const latest=sorted[0];
    const todayStr=tsToDateStr(Date.now());

    const openAdd=()=>{haptic(10);setEditingId(null);setWKg("");setWDate(todayStr);setSheetOpen(true);};
    const openEdit=w=>{haptic(8);setEditingId(w.id);setWKg(String(w.kg));setWDate(tsToDateStr(w.date));setSheetOpen(true);};
    const save=()=>{
      if(!wKg)return;
      haptic(15);
      const kg=parseFloat(wKg);
      const ts=new Date(wDate+"T12:00").getTime();
      if(editingId)setWeights(prev=>prev.map(w=>w.id===editingId?{...w,kg,date:ts,updatedAt:Date.now()}:w));
      else {setWeights(prev=>[...prev,{id:Date.now(),kg,date:ts,updatedAt:Date.now()}]);window.logAnalyticsEvent("record_added",{type:"weight"});}
      setSheetOpen(false);
    };
    const deleteWithUndo=id=>{
      haptic(15);
      setHiddenIds(prev=>new Set(prev).add(id));
      pendingDeleteTimers.current[id]=setTimeout(()=>{
        setWeights(prev=>prev.filter(w=>w.id!==id));
        setHiddenIds(prev=>{const n=new Set(prev);n.delete(id);return n;});
        delete pendingDeleteTimers.current[id];
      },3000);
      setUndoToast({
        message:lang==="he"?"הרשומה נמחקה":"Entry deleted",
        onAction:()=>{
          clearTimeout(pendingDeleteTimers.current[id]);
          delete pendingDeleteTimers.current[id];
          setHiddenIds(prev=>{const n=new Set(prev);n.delete(id);return n;});
        },
      });
    };
    const del=id=>deleteWithUndo(id);
    const delFromSheet=()=>{setSheetOpen(false);deleteWithUndo(editingId);};

    return(
      <div style={{background:T.surface,borderRadius:16,padding:16,border:`1px solid ${T.surfaceB}`,display:"flex",flexDirection:"column",gap:12}}>
