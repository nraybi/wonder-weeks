  <style>

<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script>
    window.logAnalyticsEvent = function(){};
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      let wwRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (wwRefreshing || document.getElementById('ww-update-banner')) return;
        showWwUpdateBanner();
      });
    }
    function showWwUpdateBanner(){
      const isHe = (localStorage.getItem('ww_lang') || 'he') === 'he';
      const bar = document.createElement('div');
      bar.id = 'ww-update-banner';
      bar.setAttribute('dir', isHe ? 'rtl' : 'ltr');
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:"Segoe UI",Tahoma,sans-serif;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.35);animation:ww-slide-down .3s ease;';
      bar.innerHTML = isHe
        ? '🔄 גרסה חדשה זמינה <button id="ww-refresh-btn" style="background:#fff;color:#4f46e5;border:none;border-radius:20px;padding:6px 14px;font-weight:800;font-size:12px;">רענן</button>'
        : '🔄 A new version is available <button id="ww-refresh-btn" style="background:#fff;color:#4f46e5;border:none;border-radius:20px;padding:6px 14px;font-weight:800;font-size:12px;">Refresh</button>';
      document.body.appendChild(bar);
      document.getElementById('ww-refresh-btn').onclick = () => {
        wwRefreshing = true;
        window.location.reload();
      };
    }
  </script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, browserPopupRedirectResolver, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, doc, onSnapshot, setDoc, getDoc, deleteDoc, collection, query, where, getDocs, arrayUnion, arrayRemove, runTransaction } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCPMMW6lrGBHCGjiRsdsdPCki_ynE_3Hsc",
      authDomain: "wonder-weeks-b9ee0.firebaseapp.com",
      projectId: "wonder-weeks-b9ee0",
      storageBucket: "wonder-weeks-b9ee0.firebasestorage.app",
      messagingSenderId: "321385916809",
      appId: "1:321385916809:web:11a7745e38c644b4bd5958",
      measurementId: "G-R6YVQFJGMG"
    };
    
    let app, auth, db;
    
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.error("Firebase init error", e);
    }

    // logAnalyticsEvent already has a no-op default (set in the plain <script>
    // above, before this module, so it exists even if this whole module fails
    // to load — e.g. gstatic.com blocked by network policy or an ad-blocker).
    // If analytics loads successfully, upgrade it to the real implementation.
    import('https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js')
      .then(({ getAnalytics, logEvent }) => {
        const analytics = getAnalytics(app);
        window.logAnalyticsEvent = (name, params) => logEvent(analytics, name, params);
      })
      .catch(e => console.error("Analytics unavailable", e));

    window.firebaseConfig = firebaseConfig;
    window.app = app;
    window.auth = auth;
    window.db = db;
    window.signInWithPopup = signInWithPopup;
    window.GoogleAuthProvider = GoogleAuthProvider;
    window.onAuthStateChanged = onAuthStateChanged;
    window.signOut = signOut;
    window.browserPopupRedirectResolver = browserPopupRedirectResolver;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.updateProfile = updateProfile;
    window.sendPasswordResetEmail = sendPasswordResetEmail;
    window.doc = doc;
    window.onSnapshot = onSnapshot;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
        window.deleteDoc = deleteDoc;
    window.collection = collection;
    window.query = query;
    window.where = where;
    window.getDocs = getDocs;
    window.arrayUnion = arrayUnion;
    window.arrayRemove = arrayRemove;
    window.runTransaction = runTransaction;
  </script>
  <script type="text/babel">
  const {useState,useEffect,useCallback,useRef,useMemo}=React;

  const AuthContext = React.createContext({ user: null, loading: true, roomId: null, setRoomId: () => {} });
  // Tracks, per room id, the last time this device considered the room
  // "dealt with" — either by actively joining/creating it or by declining an
  // invite to it. A room only re-surfaces as a fresh invite if it has a
  // members.invited[uid] timestamp newer than this, so being removed and
  // later re-invited to the SAME room id correctly shows the invite again.
  function markRoomSeen(id) {
    if (!id) return;
    const seen = loadLS("ww_room_seen", {});
    seen[id] = Date.now();
    saveLS("ww_room_seen", seen);
  }

  // Firestore listeners don't self-heal after their error callback fires —
  // e.g. after a mobile browser suspends the tab for a while and the
  // underlying stream goes stale on resume — the listener just dies
  // silently and nothing brings it back. Every onSnapshot in this app pairs
  // with a retryTick state that's in its effect's dependency array; calling
  // this on error schedules a bump of that tick after a short delay, which
  // makes React tear down and recreate the listener from scratch.
  // permission-denied is intentionally excluded: a single denial from an
  // aging stream can be a stale-auth-token artifact rather than a real
  // membership loss, so callers that care (see the leave-notice listener)
  // verify with a fresh one-time read before treating it as real; callers
  // that don't own that decision just stop retrying and wait for roomId to
  // change on its own once the dedicated listener resolves it.
  function scheduleSnapshotRetry(label, err, setRetryTick) {
    console.error(`Snapshot error (${label}):`, err);
    if (err && err.code === 'permission-denied') return null;
    return setTimeout(() => setRetryTick(t => t + 1), 3000);
  }

  // Fires a DOM event so a single header-level indicator can reflect the
  // aggregate state of every useSyncState listener without prop-drilling —
  // same pattern as the existing ww_local_data_restored event.
  function reportSyncStatus(key, status) {
    window.dispatchEvent(new CustomEvent('ww_sync_status', { detail: { key, status } }));
  }

  function AuthProvider({ children }) {
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);
    const [roomId, setRoomId] = useState(() => new URLSearchParams(window.location.search).get('room'));
    const [pendingRoomInvite, setPendingRoomInvite] = useState(null);
    const [leaveNotice, setLeaveNotice] = useState(null);
    const [inviteRetryTick, setInviteRetryTick] = useState(0);
    const [leaveRetryTick, setLeaveRetryTick] = useState(0);

    // Every user has exactly one durable "home room" at rooms/{uid} — never a
    // random id. This is the single path that creates or returns to it,
    // whether for a brand-new user's first room or a user recovering after
    // being removed from a shared room. Local data is merged in (not
    // overwritten), and the read-merge-write runs inside a transaction, so
    // calling this concurrently from multiple tabs/devices for the same user
    // is safe by construction — no separate locking/dedup needed.
    const ensureHomeRoom = async (authedUser) => {
      const homeRoomId = authedUser.uid;
      const homeRef = window.doc(window.db, "rooms", homeRoomId);
      const localSleeps = loadLS("ww_sleeps", []);
      const localFeeds = loadLS("ww_feeds", []);
      const localWeights = loadLS("ww_weights", []);
      const localBabyname = loadLS("ww_babyname", "");
      const localDate = loadLS("ww_date", "");

      const merged = await window.runTransaction(window.db, async (tx) => {
        const snap = await tx.get(homeRef);
        const existing = snap.exists() ? snap.data() : {};
        const mergedSleeps = mergeOnJoin(localSleeps, existing.ww_sleeps || [], true);
        const mergedFeeds = mergeOnJoin(localFeeds, existing.ww_feeds || [], false);
        const mergedWeights = mergeOnJoin(localWeights, existing.ww_weights || [], false);
        tx.set(homeRef, {
          members: window.arrayUnion(authedUser.uid),
          ww_sleeps: mergedSleeps,
          ww_feeds: mergedFeeds,
          ww_weights: mergedWeights,
          ww_babyname: existing.ww_babyname || localBabyname,
          ww_date: existing.ww_date || localDate,
          created_at: existing.created_at || Date.now()
        }, { merge: true });
        return { mergedSleeps, mergedFeeds, mergedWeights };
      });

      saveLS("ww_sleeps", merged.mergedSleeps);
      saveLS("ww_feeds", merged.mergedFeeds);
      saveLS("ww_weights", merged.mergedWeights);
      window.dispatchEvent(new Event('ww_local_data_restored'));

      markRoomSeen(homeRoomId);
      setRoomId(homeRoomId);
      const url = new URL(window.location);
      url.searchParams.set('room', homeRoomId);
      window.history.replaceState({}, '', url);
      return homeRoomId;
    };

    useEffect(() => {
      if (!window.auth) {
        setLoading(false);
        return;
      }
      return window.onAuthStateChanged(window.auth, async (u) => {
        setUser(u);
        if (u && window.db) {
          window.setDoc(window.doc(window.db, "users", u.uid), {
            email: (u.email || "").toLowerCase(),
            displayName: u.displayName,
            photoURL: u.photoURL
          }, { merge: true }).catch(console.error);

          const paramRoomId = new URLSearchParams(window.location.search).get('room');
          if (paramRoomId) {
            // Don't blindly trust the URL: it can point at a room this
            // device is no longer a member of (removed since the URL was
            // set) or was never a member of at all. Verifying first — rather
            // than adopting it and letting AuthGuard's separate, one-time
            // check discover the problem afterward — avoids a race where
            // AuthGuard's faster denial can render a blocking "Access
            // Denied" screen before our own recovery has a chance to run.
            try {
              await window.getDoc(window.doc(window.db, "rooms", paramRoomId));
              // Read succeeded, which under these security rules is only
              // possible if we're actually a member (or the room doesn't
              // exist yet at all).
              markRoomSeen(paramRoomId);
              setRoomId(paramRoomId);
            } catch (e) {
              // Denied: either a genuinely foreign link, or we were removed
              // since this URL was set. If this device previously dealt
              // with this room, treat it as the latter and recover silently
              // instead of showing Access Denied for a room we legitimately
              // left. Otherwise, adopt it anyway so AuthGuard's existing
              // denial screen explains it (a real unauthorized link).
              const seen = loadLS("ww_room_seen", {});
              if (seen[paramRoomId] !== undefined) {
                await ensureHomeRoom(u);
              } else {
                setRoomId(paramRoomId);
              }
            }
          } else {
            try {
              const q = window.query(
                window.collection(window.db, "rooms"),
                window.where("members", "array-contains", u.uid)
              );
              const snap = await window.getDocs(q);
              const activeDocs = snap.docs.filter(d => !d.data().scheduled_deletion);
              if (activeDocs.length > 0) {
                const autoRoomId = activeDocs[0].id;
                markRoomSeen(autoRoomId);
                setRoomId(autoRoomId);
                const url = new URL(window.location);
                url.searchParams.set('room', autoRoomId);
                window.history.replaceState({}, '', url);
              } else {
                await ensureHomeRoom(u);
              }
            } catch (e) {
              console.error("Auto sync room resolution error:", e);
            }
          }
        }
        setLoading(false);
      });
    }, []);

    // Live invite detection: keep listening for OTHER rooms this account gets
    // added to (e.g. a partner just invited them) while already signed in.
    // A room only counts as a fresh invite if it has no "seen" record, or the
    // owner has invited us again (a newer room.invited[uid] timestamp) since
    // we last saw it — this covers both "declined before" and "removed, then
    // re-invited to the same room id" the same way.
    useEffect(() => {
      if (!user || !window.db || !roomId) return;
      let retryTimer = null;
      const q = window.query(
        window.collection(window.db, "rooms"),
        window.where("members", "array-contains", user.uid)
      );
      const unsub = window.onSnapshot(q, snap => {
        const seen = loadLS("ww_room_seen", {});
        const candidate = snap.docs.find(d => {
          if (d.id === roomId || d.data().scheduled_deletion) return false;
          const seenAt = seen[d.id];
          if (seenAt === undefined) return true;
          const invitedAt = (d.data().invited || {})[user.uid];
          return !!invitedAt && invitedAt > seenAt;
        });
        setPendingRoomInvite(candidate ? candidate.id : null);
      }, err => {
        retryTimer = scheduleSnapshotRetry("invite-detection", err, setInviteRetryTick);
      });
      return () => { unsub(); if (retryTimer) clearTimeout(retryTimer); };
    }, [user?.uid, roomId, inviteRetryTick]);

    // Called when this device discovers it's no longer a room member — either
    // by voluntarily leaving, or by detecting a permission-denied read below
    // (the room's rules reject us once we're removed from members). Both of
    // those can fire for the SAME leave event (our own removal write also
    // trips our own listener's permission check moments later), so recovery
    // is keyed by the room id being left and deduped via a ref — whichever
    // path fires first wins and creates exactly one private room; the other
    // becomes a no-op.
    // Thin guard around ensureHomeRoom: only proceeds if we're actually
    // leaving some other room (not already home). Safe to call from multiple
    // triggers/tabs at once — see ensureHomeRoom.
    const recoverToPrivateRoom = async (fromRoomId) => {
      if (!user || !window.db || !fromRoomId || fromRoomId === user.uid) return;
      await ensureHomeRoom(user);
    };

    // Mobile PWAs can freeze JS execution while backgrounded/suspended —
    // existing onSnapshot listeners live through that freeze in memory and
    // aren't guaranteed to promptly re-signal an error on resume (unlike a
    // fresh page load, which re-verifies membership before ever adopting a
    // room — see the auth effect above). This is a belt-and-suspenders check
    // that runs whenever the tab regains visibility: independent of whatever
    // the live listeners already did, re-confirm the current room is still
    // accessible and recover immediately if not. ensureHomeRoom is
    // idempotent, so this is harmless even if a listener already recovered.
    useEffect(() => {
      if (!user || !window.db) return;
      const checkOnResume = async () => {
        if (document.visibilityState !== 'visible' || !roomId || roomId === user.uid) return;
        try {
          await window.getDoc(window.doc(window.db, "rooms", roomId));
        } catch (e) {
          console.error("Room membership check failed on resume:", e);
          await ensureHomeRoom(user);
        }
      };
      document.addEventListener('visibilitychange', checkOnResume);
      return () => document.removeEventListener('visibilitychange', checkOnResume);
    }, [user?.uid, roomId]);

    // Persisted "member left" notices live on the room doc itself (not a push
    // notification), so a member who was offline when it happened still sees
    // it next time they open the app — and must explicitly ack it to dismiss.
    useEffect(() => {
      if (!user || !window.db || !roomId) { setLeaveNotice(null); return; }
      let retryTimer = null;
      const roomRef = window.doc(window.db, "rooms", roomId);
      const unsub = window.onSnapshot(roomRef, snap => {
        if (!snap.exists()) { setLeaveNotice(null); return; }
        const notices = snap.data().leave_notices || {};
        const pending = Object.entries(notices).find(([, n]) => !(n.ackBy || []).includes(user.uid));
        setLeaveNotice(pending ? { id: pending[0], ...pending[1] } : null);
      }, async (err) => {
        if (err && err.code === 'permission-denied') {
          // Don't trust a single denial from this listener: a stale auth
          // token after the device wakes from being backgrounded/suspended
          // can also surface as permission-denied even though we're still a
          // legitimate member. Confirm with a fresh one-time read first.
          try {
            const freshSnap = await window.getDoc(roomRef);
            const stillMember = freshSnap.exists() && (freshSnap.data().members || []).includes(user.uid);
            if (!stillMember) { recoverToPrivateRoom(roomId); return; }
          } catch (e) {
            recoverToPrivateRoom(roomId); // fresh read denied too: genuinely removed
            return;
          }
        }
        retryTimer = scheduleSnapshotRetry("leave-notices", err, setLeaveRetryTick);
      });
      return () => { unsub(); if (retryTimer) clearTimeout(retryTimer); };
    }, [user?.uid, roomId, leaveRetryTick]);

    const ackLeaveNotice = () => {
      if (!leaveNotice || !window.db || !roomId || !user) return;
      const roomRef = window.doc(window.db, "rooms", roomId);
      window.setDoc(roomRef, {
        leave_notices: { [leaveNotice.id]: { ackBy: window.arrayUnion(user.uid) } }
      }, { merge: true }).catch(console.error);
      setLeaveNotice(null);
    };

    // Merge-on-join: the guest's local records are folded into the host's room
    // data instead of overwriting it. Same-ID records are skipped (host's copy
    // already represents them). Non-overlapping records are simply unioned.
    // Overlapping-but-not-matching records (beyond a 2min start/end tolerance)
    // are kept from both sides, with the guest's copy flagged as a conflict
    // for manual review instead of being silently dropped or auto-resolved.
    const acceptRoomInvite = async () => {
      if (!pendingRoomInvite || !window.db) return;
      const targetRoomId = pendingRoomInvite;
      setPendingRoomInvite(null);
      try {
        const roomRef = window.doc(window.db, "rooms", targetRoomId);
        const snap = await window.getDoc(roomRef);
        const hostData = snap.exists() ? snap.data() : {};

        const mergedSleeps = mergeOnJoin(loadLS("ww_sleeps", []), hostData.ww_sleeps || [], true);
        const mergedFeeds = mergeOnJoin(loadLS("ww_feeds", []), hostData.ww_feeds || [], false);
        const mergedWeights = mergeOnJoin(loadLS("ww_weights", []), hostData.ww_weights || [], false);

        await window.setDoc(roomRef, {
          ww_sleeps: mergedSleeps, ww_feeds: mergedFeeds, ww_weights: mergedWeights
        }, { merge: true });

        saveLS("ww_sleeps", mergedSleeps);
        saveLS("ww_feeds", mergedFeeds);
        saveLS("ww_weights", mergedWeights);
        window.dispatchEvent(new Event('ww_local_data_restored'));

        const url = new URL(window.location);
        url.searchParams.set('room', targetRoomId);
        window.history.replaceState({}, '', url);
        markRoomSeen(targetRoomId);
        setRoomId(targetRoomId);
      } catch (e) {
        console.error("Merge on join failed:", e);
      }
    };
    const declineRoomInvite = () => {
      if (!pendingRoomInvite) return;
      markRoomSeen(pendingRoomInvite);
      setPendingRoomInvite(null);
    };

    return <AuthContext.Provider value={{ user, loading, roomId, setRoomId, pendingRoomInvite, acceptRoomInvite, declineRoomInvite, leaveNotice, ackLeaveNotice, recoverToPrivateRoom }}>
      {children}
    </AuthContext.Provider>;
  }
  function useAuth() { return React.useContext(AuthContext); }

  function mergeArrayData(localList = [], cloudList = [], deletedIdsMap = {}) {
    const mergedMap = new Map();
    const getItemTime = (item) => {
      if (!item) return 0;
      return item.updatedAt || item.start || item.date || item.id || 0;
    };

    for (const item of (cloudList || [])) {
      if (!item || item.id === undefined || item.id === null) continue;
      const strId = String(item.id);
      if (deletedIdsMap[strId]) continue;
      mergedMap.set(strId, item);
    }

    for (const item of (localList || [])) {
      if (!item || item.id === undefined || item.id === null) continue;
      const strId = String(item.id);
      if (deletedIdsMap[strId]) continue;

      const existing = mergedMap.get(strId);
      if (!existing) {
        mergedMap.set(strId, item);
      } else {
        const localTime = getItemTime(item);
        const cloudTime = getItemTime(existing);
        if (localTime > cloudTime) {
          mergedMap.set(strId, item);
        } else if (localTime === cloudTime) {
          mergedMap.set(strId, { ...existing, ...item });
        }
      }
    }

    return Array.from(mergedMap.values());
  }

  // One-time merge used when a guest accepts a room invite. isInterval=true
  // treats records as [start,end] spans (sleeps); false treats them as point
  // events (feeds/weights), where start and end are the same instant.
  function mergeOnJoin(guestList = [], hostList = [], isInterval, tolMs = 2 * 60 * 1000) {
    const hostIds = new Set((hostList || []).filter(r => r && r.id != null).map(r => String(r.id)));
    const result = [...(hostList || [])];
    for (const g of (guestList || [])) {
      if (!g || g.id == null || hostIds.has(String(g.id))) continue;
      const gStart = g.start ?? g.date;
      const gEnd = isInterval ? (g.end ?? Date.now()) : gStart;
      let duplicate = false, conflict = false;
      for (const h of (hostList || [])) {
        if (!h) continue;
        const hStart = h.start ?? h.date;
        const hEnd = isInterval ? (h.end ?? Date.now()) : hStart;
        if (isInterval) {
          if (gStart <= hEnd && hStart <= gEnd) {
            if (Math.abs(gStart - hStart) <= tolMs && Math.abs(gEnd - hEnd) <= tolMs) { duplicate = true; break; }
            conflict = true;
          }
        } else if (Math.abs(gStart - hStart) <= tolMs) { duplicate = true; break; }
      }
      if (duplicate) continue;
      result.push(conflict ? { ...g, conflict: true } : g);
    }
    return result;
  }

  // Pure merge/compare logic, kept separate from the onSnapshot listener in
  // useSyncState so the listener's job is only: read snapshot -> decide via
  // these -> apply (setState/saveLS) -> write back if needed.
  function reconcileArrayField(key, cloudData, localVal) {
    const localArr = Array.isArray(localVal) ? localVal : [];
    const cloudArr = Array.isArray(cloudData[key]) ? cloudData[key] : [];
    const localDeleted = loadLS("ww_deleted_ids", {});
    const cloudDeleted = cloudData.ww_deleted_ids || {};
    const mergedDeleted = { ...localDeleted, ...cloudDeleted };
    const mergedArr = mergeArrayData(localArr, cloudArr, mergedDeleted);
    const needsWrite = JSON.stringify(cloudArr) !== JSON.stringify(mergedArr)
      || JSON.stringify(cloudDeleted) !== JSON.stringify(mergedDeleted);
    return { mergedArr, mergedDeleted, needsWrite };
  }

  function reconcileScalarField(cloudVal, localVal) {
    if (cloudVal !== undefined && cloudVal !== null && cloudVal !== "") {
      return { value: cloudVal, saveLocal: true, needsWrite: false };
    }
    if (localVal !== undefined && localVal !== null && localVal !== "") {
      return { value: localVal, saveLocal: false, needsWrite: true };
    }
    return null;
  }

  function useSyncState(key, initialValue) {
    const { roomId, user } = useAuth();
    const [state, setState] = useState(() => loadLS(key, initialValue));
    const [retryTick, setRetryTick] = useState(0);

    useEffect(() => {
      const handleLocalRestored = () => {
        const localVal = loadLS(key, initialValue);
        setState(localVal);
      };
      window.addEventListener('ww_local_data_restored', handleLocalRestored);
      return () => {
        window.removeEventListener('ww_local_data_restored', handleLocalRestored);
      };
    }, [key]);

    useEffect(() => {
      if (!roomId || !user || !window.db) return;
      let retryTimer = null;

      const roomRef = window.doc(window.db, "rooms", roomId);
      reportSyncStatus(key, 'syncing');
      const unsubscribe = window.onSnapshot(roomRef, (docSnap) => {
        reportSyncStatus(key, 'synced');
        if (!docSnap.exists()) return;

        const cloudData = docSnap.data();
        const cloudVal = cloudData[key];
        const localVal = loadLS(key, initialValue);

        if (Array.isArray(initialValue) || Array.isArray(localVal) || Array.isArray(cloudVal)) {
          const { mergedArr, mergedDeleted, needsWrite } = reconcileArrayField(key, cloudData, localVal);

          saveLS("ww_deleted_ids", mergedDeleted);
          saveLS(key, mergedArr);
          setState(mergedArr);

          if (needsWrite) {
            window.setDoc(roomRef, {
              [key]: mergedArr,
              ww_deleted_ids: mergedDeleted
            }, { merge: true }).catch(console.error);
          }
        } else {
          const result = reconcileScalarField(cloudVal, localVal);
          if (result) {
            setState(result.value);
            if (result.saveLocal) saveLS(key, result.value);
            if (result.needsWrite) {
              window.setDoc(roomRef, { [key]: result.value }, { merge: true }).catch(console.error);
            }
          }
        }
      }, (err) => {
        reportSyncStatus(key, 'error');
        retryTimer = scheduleSnapshotRetry(`sync:${key}`, err, setRetryTick);
      });

      return () => { unsubscribe(); if (retryTimer) clearTimeout(retryTimer); };
    }, [roomId, user?.uid, key, retryTick]);

    const setSyncedState = useCallback((newValue) => {
      setState(prev => {
        const updated = typeof newValue === 'function' ? newValue(prev) : newValue;
        saveLS(key, updated);

        if (roomId && user && window.db) {
          const roomRef = window.doc(window.db, "rooms", roomId);
          const payload = { [key]: updated };

          if (Array.isArray(prev) && Array.isArray(updated)) {
            const updatedIds = new Set(updated.filter(i => i && i.id !== undefined && i.id !== null).map(i => String(i.id)));
            const deletedMap = loadLS("ww_deleted_ids", {});
            let changedDeleted = false;
            for (const item of prev) {
              if (item && item.id !== undefined && item.id !== null) {
                const strId = String(item.id);
                if (!updatedIds.has(strId)) {
                  deletedMap[strId] = Date.now();
                  changedDeleted = true;
                }
              }
            }
            if (changedDeleted) {
              saveLS("ww_deleted_ids", deletedMap);
              payload.ww_deleted_ids = deletedMap;
            }
          }

          window.setDoc(roomRef, payload, { merge: true }).catch(console.error);
        }
        return updated;
      });
    }, [roomId, user?.uid, key]);

    return [state, setSyncedState];
  }

  function AuthGuard({ children }) {
    const { user, loading, roomId, recoverToPrivateRoom } = useAuth();
    const lang = loadLS("ww_lang", "he");
    const [accessStatus, setAccessStatus] = useState("pending");
    
    useEffect(() => {
      if (!roomId) {
        setAccessStatus("granted");
        return;
      }
      if (user && window.db) {
        window.getDoc(window.doc(window.db, "rooms", roomId)).then(snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.members?.includes(user.uid)) {
              setAccessStatus("granted");
            } else {
              setAccessStatus("denied");
            }
          } else {
            setAccessStatus("granted");
          }
        }).catch(e => {
          console.error(e);
          setAccessStatus("denied");
        });
      } else {
        setAccessStatus("granted");
      }
    }, [user, roomId]);

    if (!roomId || !user) return children;
    if (loading || accessStatus === "pending") return null;

    if (accessStatus === "denied") {
      return (
        <div style={{position:"fixed",inset:0,background:"#0a0f1e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,color:"#fff",zIndex:9999}}>
          <h2 style={{fontSize:22,marginBottom:12,fontWeight:800,color:"#ef4444"}}>{lang === "he" ? "גישה נדחתה" : "Access Denied"}</h2>
          <p style={{fontSize:14,color:"#94a3b8",textAlign:"center",marginBottom:24,lineHeight:1.6}}>
            {lang === "he" ? "אינך מורשה לגשת לחדר זה. בקש מבעל החדר להזמין אותך באמצעות כתובת האימייל שלך." : "You are not authorized to access this room. Ask the room owner to invite you using your email address."}
          </p>
          <button onClick={() => {
            recoverToPrivateRoom(roomId);
          }} 
            style={{padding:"14px 24px",background:"#334155",borderRadius:16,color:"#fff",fontWeight:800,fontSize:16,border:"none"}}>
            {lang === "he" ? "חזור לחדר שלי" : "Return to my room"}
          </button>
        </div>
      );
    }

    return children;
  }

  // NOAA solar calculation — returns {sunriseMin, sunsetMin} in local minutes-of-day
  function calcSunTimes(lat,lng,date){
    const d=date||new Date();
    const N=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
    const lngHour=lng/15;
    const calc=(isRise)=>{
      const t=N+((isRise?6:18)-lngHour)/24;
      const M=(0.9856*t)-3.289;
      let L=M+(1.916*Math.sin(M*Math.PI/180))+(0.020*Math.sin(2*M*Math.PI/180))+282.634;
      L=(L+360)%360;
      let RA=(180/Math.PI)*Math.atan(0.91764*Math.tan(L*Math.PI/180));
      RA=(RA+360)%360;
      const Lq=Math.floor(L/90)*90, RAq=Math.floor(RA/90)*90;
      RA=RA+(Lq-RAq); RA/=15;
      const sinDec=0.39782*Math.sin(L*Math.PI/180);
      const cosDec=Math.cos(Math.asin(sinDec));
      const cosH=(Math.cos(90.833*Math.PI/180)-(sinDec*Math.sin(lat*Math.PI/180)))/(cosDec*Math.cos(lat*Math.PI/180));
      if(cosH>1||cosH<-1)return null; // sun never rises/sets (polar)
      let H=isRise?360-(180/Math.PI)*Math.acos(cosH):(180/Math.PI)*Math.acos(cosH);
      H/=15;
      const T=H+RA-(0.06571*t)-6.622;
      let UT=(T-lngHour+24)%24;
      return UT;

  // predictor below — one definition of "which sleep is the night sleep") ──

  // active session force-closed much later, not a real sleep event. Excluded
  // from day-boundary and predictor logic (kept as-is everywhere else —

  function isImplausibleSleep(s){return!!s.end&&(s.end-s.start)>18*3600000;}

  function isNightSleep(s,sunriseMin,sunsetMin){

  const WW_PARAMS={halfLifeDays:10,durSigmaMin:20,defaultNapDurMin:80,blend:.9,clipLoMin:60,clipHiMin:280,neutralDefaultMin:140};

  function ewmaFreeWW(history,todayKey,prevDur,p=WW_PARAMS){

  // predictor's training data uses the exact same boundary as "today"'s

  // real wake window (>400min) — that signals a missing/unlogged night
  // rather than one very long wake window; the sub-group after the gap is
  // re-anchored to that day's sunrise rather than chained to a morning
  // wake it didn't actually follow.
  // Segments the full sleep history into days — direct port of buildDays +
  // splitOnAnomalousGaps from wake-window-estimator.js (the version actually
  // backtested: ~18.8min MAE excl. cold-start days), not a reimplementation.
  // Segment-based, not calendar-day iteration: it never needs to know when a
  // day *ends* to start recording it, so today's in-progress naps are
  // captured the same way as any completed day — no separate "still open"
  // case needed.
  function buildSleepDays(sleeps,sunTimes){

    // before sunrise+1h (absolute instant, not time-of-day — a normal
    // evening bedtime must count as "before" next morning's sunrise). Falls
    // back to sunrise itself if nothing in the group qualifies (log gap).
    function morningWakeOf(nightItems){

    // window (>400min) — that means a night sleep was missing from the log
    // entirely; the sub-group after the gap is re-anchored to that day's
    // sunrise rather than chained to a morning wake it didn't follow.
    const out=[];

          start=k;
          if(!atEnd)morningWake=startOfDay(day.daySleeps[k].start)+sunriseMin*60000;
        }
      }
    }
    return out;
  }

  // ─── COMPACT DATE+TIME FIELD (time is primary; date collapses to a small pill) ──

  // ─── BOTTOM SHEET (native modal pattern, swipe-to-dismiss) ──────────────────
  function BottomSheet({open,onClose,children,T}){
    const[dragY,setDragY]=useState(0);
    const startY=useRef(null);
    const dragging=useRef(false);
    useEffect(()=>{document.body.style.overflow=open?"hidden":"";return()=>{document.body.style.overflow="";};},[open]);
    if(!open)return null;
    const onTS=e=>{startY.current=e.touches[0].clientY;dragging.current=true;};
    const onTM=e=>{if(!dragging.current)return;const d=e.touches[0].clientY-startY.current;if(d>0)setDragY(d);};
    const onTE=()=>{dragging.current=false;if(dragY>85){haptic(8);onClose();}setDragY(0);};
    // Rendered via portal straight onto <body> so this fixed-position sheet can
    // never get trapped inside an ancestor's stacking/containing-block context
    // (e.g. from a CSS transform/animation higher up in the tree) — that trapping
    // was why the sheet's bottom content could end up rendering behind the fixed
    // bottom nav bar instead of above it.
    return ReactDOM.createPortal(
      <div style={{position:"fixed",inset:0,zIndex:1000,display:"flex",alignItems:"flex-end"}}>
        <div onClick={()=>{haptic(6);onClose();}} style={{position:"absolute",inset:0,background:"rgba(0,0,0,.55)",backdropFilter:"blur(3px)",animation:"fadeUp .25s ease"}}/>

          <div style={{width:38,height:4,borderRadius:8,background:"rgba(128,128,128,.35)",margin:"4px auto 16px"}}/>
          {children}
        </div>
      </div>,
      document.body
    );
  }

  // ─── SWIPEABLE ROW (swipe-left reveals delete, tap opens edit) ─────────────
  function SwipeableRow({children,onDelete,onTap,T,deleteLabel}){
    const[tx,setTx]=useState(0);
    const startX=useRef(null);
    const dragging=useRef(false);
    const moved=useRef(false);
    const REVEAL=72;
    const onTS=e=>{startX.current=e.touches[0].clientX;dragging.current=true;moved.current=false;};
    const onTM=e=>{
      if(!dragging.current)return;
      const raw=e.touches[0].clientX-startX.current;
      if(Math.abs(raw)>6)moved.current=true;
      setTx(Math.max(-REVEAL-14,Math.min(0,raw)));
    };
    const onTE=()=>{
      dragging.current=false;
      setTx(t=>{const snap=t<-REVEAL/2?-REVEAL:0; if(snap!==0)haptic(6); return snap;});
    };
    const onTap2=()=>{
      if(moved.current)return;
      if(tx!==0){setTx(0);return;}
      if(onTap)onTap();
    };
    return(
      <div style={{position:"relative",overflow:"hidden",borderRadius:12}}>
        <div style={{position:"absolute",top:0,bottom:0,right:0,width:REVEAL,display:"flex"}}>
          <button onClick={()=>{haptic(15);onDelete();}} aria-label={deleteLabel} style={{flex:1,background:"linear-gradient(135deg,#ef4444,#dc2626)",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:tx<=-REVEAL?"0 12px 12px 0":0}}>
            <IconTrash size={16}/>
          </button>
        </div>
        <div onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE} onClick={onTap2}
          style={{transform:`translateX(${tx}px)`,transition:dragging.current?"none":"transform .25s cubic-bezier(.32,.72,0,1)",background:T.rowSolidBg,position:"relative",borderRadius:12,touchAction:"pan-y",cursor:onTap?"pointer":"default"}}>
          {children}
        </div>
      </div>
    );
  }

  // ─── LEAPS TAB ───────────────────────────────────────────────────────────────
