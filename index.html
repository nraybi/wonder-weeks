          <button onClick={openAdd} style={{padding:"6px 12px",background:T.accentBg,border:`1px solid ${T.accentB}`,borderRadius:12,color:T.accentText,fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:4}}>
            <IconPlus size={13} color={T.accentText}/>{S.settings.updateWeight}
          </button>
        </div>
        {latest?(
          <div style={{display:"flex",alignItems:"baseline",gap:8}}>
            <div style={{fontSize:28,fontWeight:900,color:T.text}}>{latest.kg}<span style={{fontSize:14,fontWeight:600,color:T.sub}}> kg</span></div>
            <div style={{fontSize:11,color:T.muted}}>{S.settings.recordedOn} {new Date(latest.date).toLocaleDateString(lang==="he"?"he-IL":"en-US",{day:"numeric",month:"short"})}</div>
          </div>
        ):(
          <div style={{fontSize:12,color:T.muted}}>{S.settings.noWeight}</div>
        )}
        {sparkData.length>=2&&<WeightSparkline data={sparkData} color={T.accent}/>}
        {sorted.length>1&&(
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {sorted.slice(1,5).map(w=>(
              <SwipeableRow key={w.id} T={T} deleteLabel={S.feed.delete} onDelete={()=>del(w.id)} onTap={()=>openEdit(w)}>
                <div style={{display:"flex",justifyContent:"space-between",padding:"7px 10px"}}>
                  <span style={{fontSize:12,color:T.text,fontWeight:600}}>{w.kg} kg</span>
                  <span style={{fontSize:11,color:T.sub}}>{new Date(w.date).toLocaleDateString(lang==="he"?"he-IL":"en-US",{day:"numeric",month:"short"})}</span>
                </div>
              </SwipeableRow>
            ))}
          </div>
        )}
        <BottomSheet open={sheetOpen} onClose={()=>setSheetOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:16,textAlign:"center"}}>{editingId?(lang==="he"?"עריכת משקל":"Edit Weight"):S.settings.updateWeight}</div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>⚖️ {S.settings.weightKg}</div>
            <input type="number" step="0.1" inputMode="decimal" placeholder="0.0" value={wKg} onChange={e=>setWKg(e.target.value)}
              style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:18,fontWeight:700,outline:"none",textAlign:"center"}}/>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>📅 {lang==="he"?"תאריך":"Date"}</div>
            <input type="date" value={wDate} max={todayStr} onChange={e=>setWDate(e.target.value)}
              style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:15,outline:"none",colorScheme:T.ds}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            {editingId&&<button onClick={delFromSheet} aria-label={S.feed.delete} style={{padding:"0 18px",background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IconTrash size={17} color="#ef4444"/>
            </button>}
            <button onClick={save} disabled={!wKg} style={{flex:1,padding:14,background:wKg?"linear-gradient(135deg,#6366f1,#8b5cf6)":"rgba(128,128,128,.2)",border:"none",borderRadius:16,color:wKg?"#fff":T.sub,fontSize:15,fontWeight:800,boxShadow:wKg?"0 4px 20px rgba(99,102,241,.4)":"none"}}>{S.feed.save}</button>
          </div>
        </BottomSheet>

        {undoToast&&<Toast message={undoToast.message} type="error" duration={3000} actionLabel={lang==="he"?"בטל":"Undo"} onAction={undoToast.onAction} onDone={()=>setUndoToast(null)}/>}
      </div>
    );
  }

  // Minimal dependency-free trend line — data must be sorted ascending by
  // date, length >= 2. Kept as plain SVG to match the rest of the app's
  // no-build-step, no-chart-library approach.
  function WeightSparkline({data,color}){
    const w=300,h=52,pad=6;
    const kgs=data.map(d=>d.kg);
    const min=Math.min(...kgs),max=Math.max(...kgs);
    const range=(max-min)||1;
    const pts=data.map((d,i)=>{
      const x=pad+(i/(data.length-1))*(w-pad*2);
      const y=pad+(1-(d.kg-min)/range)*(h-pad*2);
      return[x,y];
    });
    const pointsAttr=pts.map(p=>p.join(",")).join(" ");
    return(
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:52,display:"block"}} preserveAspectRatio="none">
        <polyline points={pointsAttr} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r="2.5" fill={color}/>)}
      </svg>
    );
  }

  // ─── CSV EXPORT ──────────────────────────────────────────────────────────────
  function csvEsc(v){
    if(v===null||v===undefined)return"";
    const s=String(v);
    return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }
  // Local (wall-clock) ISO 8601 string, e.g. "2026-08-19T14:30:00" — deliberately
  // NOT toISOString(), which always converts to UTC first and would silently
  // shift every exported timestamp by the device's UTC offset.
  function toLocalISO(ts){
    const d=new Date(ts);
    const p=n=>String(n).padStart(2,"0");
    return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  // Three independent exports — one file per data type, no calculated/derived
  // columns (e.g. no sleep duration), local ISO 8601 timestamps, UTF-8 BOM so
  // Hebrew notes render correctly when opened in Excel.
  function buildSleepCSV(sleeps){
    const lines=[["Start","End"].map(csvEsc).join(",")];
    [...sleeps].sort((a,b)=>a.start-b.start).forEach(s=>{
      lines.push([toLocalISO(s.start),s.end?toLocalISO(s.end):""].map(csvEsc).join(","));
    });
    return"\uFEFF"+lines.join("\n");
  }
  function buildFeedCSV(feeds){
    const lines=[["DateTime","Type","Prepared (ml)","Consumed (ml)","Note"].map(csvEsc).join(",")];
    const feedRows=[];
    feeds.forEach(f=>{
      if(f.type==="bottle"){
        bottleSittingsOf(f).forEach(s=>feedRows.push({ts:s.start,type:"bottle",prepared:f.prepared??"",consumed:s.amount??"",note:f.note??""}));
      } else {
        feedRows.push({ts:f.start,type:f.type,prepared:"",consumed:f.amount??"",note:f.note??""});
      }
    });
    feedRows.sort((a,b)=>a.ts-b.ts).forEach(r=>{
      lines.push([toLocalISO(r.ts),r.type,r.prepared,r.consumed,r.note].map(csvEsc).join(","));
    });
    return"\uFEFF"+lines.join("\n");
  }
  function buildWeightCSV(weights){
    const lines=[["Date","Weight (kg)"].map(csvEsc).join(",")];
    [...weights].sort((a,b)=>a.date-b.date).forEach(w=>{
      lines.push([toLocalISO(w.date),w.kg].map(csvEsc).join(","));
    });
    return"\uFEFF"+lines.join("\n");
  }
  function downloadFile(content,filename,mime){
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function sanitizeFilePart(s){
    return(s||"").trim().replace(/[^a-zA-Z0-9\u0590-\u05FF_-]+/g,"-").replace(/^-+|-+$/g,"")||"";
  }

  // ─── BACKUP CODE ENCODE/DECODE (UTF-8 safe base64) ──────────────────────────
  function encodeBackup(state){
    const json=JSON.stringify(state);
    return btoa(unescape(encodeURIComponent(json)));
  }
  function decodeBackup(code){
    const json=decodeURIComponent(escape(atob(code.trim())));
    return JSON.parse(json);
  }

  // ─── EXPORT SECTION ──────────────────────────────────────────────────────────
  // Opens a bottom sheet (consistent with the rest of the app's sheet pattern)
  // offering three independent CSV exports — sleep, feed, weight — each its
  // own file/download, rather than one combined multi-section CSV.
  function ExportSection({T,S,lang,babyName,birthDate}){
    const[sheetOpen,setSheetOpen]=useState(false);

    const doExport=(type)=>{
      haptic(10);
      const namePart=sanitizeFilePart(babyName)||"baby";
      const dobPart=birthDate||"unknown-dob";
      const todayPart=tsToDateStr(Date.now());
      let csv;
      if(type==="sleep")csv=buildSleepCSV(loadLS("ww_sleeps",[]));
      else if(type==="feed")csv=buildFeedCSV(loadLS("ww_feeds",[]));
      else csv=buildWeightCSV(loadLS("ww_weights",[]));
      const filename=`wonder-weeks-${namePart}-dob-${dobPart}-${type}-${todayPart}.csv`;
      downloadFile(csv,filename,"text/csv;charset=utf-8;");
      setSheetOpen(false);
    };

    return(
      <>
        <button onClick={()=>{haptic(8);setSheetOpen(true);}} style={{padding:14,background:T.surface,border:`1px solid ${T.surfaceB}`,borderRadius:16,color:T.text,fontSize:13.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
          <span style={{display:"flex",alignItems:"center",gap:8}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.text} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            {S.settings.exportData}
          </span>
          <span style={{color:T.sub,fontSize:13}}>▾</span>
        </button>

        <BottomSheet open={sheetOpen} onClose={()=>setSheetOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:16,textAlign:"center"}}>{S.settings.exportData}</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <button onClick={()=>doExport("sleep")} style={{padding:14,background:T.surface2,border:`1px solid ${T.surface2B}`,borderRadius:14,color:T.text,fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:10}}>
              <IconMoonZzz size={18} color={T.sleepColor}/>{S.settings.exportSleep}
            </button>
            <button onClick={()=>doExport("feed")} style={{padding:14,background:T.surface2,border:`1px solid ${T.surface2B}`,borderRadius:14,color:T.text,fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:10}}>
              <IconBottle size={18} color={T.feedColor}/>{S.settings.exportFeed}
            </button>
            <button onClick={()=>doExport("weight")} style={{padding:14,background:T.surface2,border:`1px solid ${T.surface2B}`,borderRadius:14,color:T.text,fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:10}}>
              <IconScale size={18} color={T.text}/>{S.settings.exportWeight}
            </button>
          </div>
        </BottomSheet>
      </>
    );
  }

  // ─── BACKUP & RESTORE SECTION ────────────────────────────────────────────────
  function BackupSection({T,S,lang,babyName,birthDate}){
    const { roomId } = useAuth();
    const[copied,setCopied]=useState(false);
    const[codeSheetOpen,setCodeSheetOpen]=useState(false);
    const[backupCode,setBackupCode]=useState("");
    const[restoreOpen,setRestoreOpen]=useState(false);
    const[restoreCode,setRestoreCode]=useState("");
    const[restoreError,setRestoreError]=useState(false);
    const codeRef=useRef(null);

    const doBackup=()=>{
      haptic(10);
      const state={
        v:1,
        babyName, birthDate,
        sleeps:loadLS("ww_sleeps",[]),
        feeds:loadLS("ww_feeds",[]),
        weights:loadLS("ww_weights",[]),
      };
      setBackupCode(encodeBackup(state));
      setCopied(false);
      setCodeSheetOpen(true);
    };

    const copyCode=async()=>{
      haptic(8);
      let ok=false;
      try{ await navigator.clipboard.writeText(backupCode); ok=true; }
      catch{
        try{
          if(codeRef.current){
            codeRef.current.focus();
            codeRef.current.select();
            ok=document.execCommand("copy");
          }
        }catch{}
      }
      if(ok){setCopied(true);setTimeout(()=>setCopied(false),2500);}
    };

    const openRestore=()=>{haptic(8);setRestoreCode("");setRestoreError(false);setRestoreOpen(true);};

    const doRestore=async()=>{
      try{
        const state=decodeBackup(restoreCode);
        if(!state||typeof state!=="object")throw new Error("invalid");

        const deletedMap = loadLS("ww_deleted_ids", {});

        const restoredSleeps = (state.sleeps || []).map(s => ({ ...s, updatedAt: s.updatedAt || s.start || Date.now() }));
        const restoredFeeds = (state.feeds || []).map(f => ({ ...f, updatedAt: f.updatedAt || f.start || Date.now() }));
        const restoredWeights = (state.weights || []).map(w => ({ ...w, updatedAt: w.updatedAt || w.date || Date.now() }));

        [...restoredSleeps, ...restoredFeeds, ...restoredWeights].forEach(item => {
          if (item && item.id !== undefined && item.id !== null) {
            delete deletedMap[String(item.id)];
          }
        });
        saveLS("ww_deleted_ids", deletedMap);

        const currentSleeps = loadLS("ww_sleeps", []);
        const currentFeeds = loadLS("ww_feeds", []);
        const currentWeights = loadLS("ww_weights", []);

        const mergedSleeps = mergeArrayData(currentSleeps, restoredSleeps, deletedMap);
        const mergedFeeds = mergeArrayData(currentFeeds, restoredFeeds, deletedMap);
        const mergedWeights = mergeArrayData(currentWeights, restoredWeights, deletedMap);

        saveLS("ww_sleeps", mergedSleeps);
        saveLS("ww_feeds", mergedFeeds);
        saveLS("ww_weights", mergedWeights);

        const newBirthDate = state.birthDate || localStorage.getItem("ww_date") || "";
        const newBabyName = state.babyName !== undefined ? state.babyName : (localStorage.getItem("ww_babyname") || "");

        if(newBirthDate) localStorage.setItem("ww_date", newBirthDate);
        if(newBabyName !== undefined) localStorage.setItem("ww_babyname", newBabyName);

        if (roomId && window.db) {
          const roomRef = window.doc(window.db, "rooms", roomId);
          const payload = {
            ww_sleeps: mergedSleeps,
            ww_feeds: mergedFeeds,
            ww_weights: mergedWeights,
            ww_deleted_ids: deletedMap
          };
          if (newBirthDate) payload.ww_date = newBirthDate;
          if (newBabyName !== undefined) payload.ww_babyname = newBabyName;

          await window.setDoc(roomRef, payload, { merge: true }).catch(console.error);
        }

        window.dispatchEvent(new CustomEvent('ww_local_data_restored'));
        haptic(15);
        setRestoreOpen(false);
        setTimeout(() => window.location.reload(), 300);
      }catch(e){
        console.error("Restore error:", e);
        haptic(20);
        setRestoreError(true);
      }
    };

    return(
      <div style={{background:T.surface,borderRadius:16,padding:16,border:`1px solid ${T.surfaceB}`,display:"flex",flexDirection:"column",gap:10}}>
        <div style={{fontSize:12,fontWeight:700,color:T.sub}}>💾 {lang==="he"?"גיבוי ושחזור":"Backup & Restore"}</div>
        <div style={{fontSize:11,color:T.muted,lineHeight:1.5}}>
          {lang==="he"?"צרו קוד גיבוי ושמרו אותו במקום בטוח. הקוד מכיל את כל נתוני השינה, ההאכלה והמשקל, ומאפשר שחזור מלא גם לאחר איפוס.":"Create a backup code and keep it safe. It contains all sleep, feed, and weight data, and lets you fully restore even after a reset."}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={doBackup} style={{flex:1,padding:12,background:T.accentBg,border:`1px solid ${T.accentB}`,borderRadius:12,color:T.accentText,fontSize:12.5,fontWeight:700}}>
            📋 {lang==="he"?"הצג קוד גיבוי":"Show Backup Code"}
          </button>
          <button onClick={openRestore} style={{flex:1,padding:12,background:T.surface2,border:`1px solid ${T.surface2B}`,borderRadius:12,color:T.text,fontSize:12.5,fontWeight:700}}>
            ♻️ {lang==="he"?"שחזר מקוד":"Restore from Code"}
          </button>
        </div>

        {/* Show backup code sheet — always visible so manual copy always works as a fallback */}
        <BottomSheet open={codeSheetOpen} onClose={()=>setCodeSheetOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:10,textAlign:"center"}}>{lang==="he"?"קוד הגיבוי שלך":"Your Backup Code"}</div>
          <div style={{fontSize:11,color:T.muted,marginBottom:10,lineHeight:1.5}}>
            {lang==="he"?"לחצו על 'העתק'. אם זה לא עובד, בחרו את הטקסט למטה ידנית והעתיקו אותו בעצמכם.":"Tap Copy. If that doesn't work, manually select the text below and copy it yourself."}
          </div>
          <textarea ref={codeRef} readOnly value={backupCode} onFocus={e=>e.target.select()}
            style={{width:"100%",minHeight:130,padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:11.5,outline:"none",resize:"vertical",fontFamily:"monospace",direction:"ltr",marginBottom:14}}/>
          <button onClick={copyCode} style={{width:"100%",padding:14,background:copied?"rgba(34,197,94,.18)":"linear-gradient(135deg,#6366f1,#8b5cf6)",border:copied?"1px solid rgba(34,197,94,.4)":"none",borderRadius:16,color:copied?"#4ade80":"#fff",fontSize:15,fontWeight:800,boxShadow:copied?"none":"0 4px 20px rgba(99,102,241,.4)"}}>
            {copied?"✓ "+(lang==="he"?"הועתק!":"Copied!"):"📋 "+(lang==="he"?"העתק ללוח":"Copy to Clipboard")}
          </button>
        </BottomSheet>

        <BottomSheet open={restoreOpen} onClose={()=>setRestoreOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:14,textAlign:"center"}}>{lang==="he"?"שחזור מקוד גיבוי":"Restore from Backup Code"}</div>
          <div style={{fontSize:12,color:"#f59e0b",marginBottom:10,lineHeight:1.5}}>⚠️ {lang==="he"?"פעולה זו תחליף את כל הנתונים הקיימים באפליקציה.":"This will overwrite all current data in the app."}</div>
          <textarea value={restoreCode} onChange={e=>{setRestoreCode(e.target.value);setRestoreError(false);}} placeholder={lang==="he"?"הדביקו כאן את קוד הגיבוי...":"Paste your backup code here..."}
            style={{width:"100%",minHeight:110,padding:"11px 14px",background:T.input,border:`1px solid ${restoreError?"#ef4444":T.inputB}`,borderRadius:12,color:T.inputText,fontSize:12.5,outline:"none",resize:"vertical",fontFamily:"monospace",marginBottom:restoreError?6:14,direction:"ltr"}}/>
          {restoreError&&<div style={{color:"#ef4444",fontSize:11,marginBottom:14}}>{lang==="he"?"קוד לא תקין. ודאו שהעתקתם את הקוד המלא.":"Invalid code. Make sure you copied the full code."}</div>}
          <button onClick={doRestore} disabled={!restoreCode.trim()} style={{width:"100%",padding:14,background:restoreCode.trim()?"linear-gradient(135deg,#6366f1,#8b5cf6)":"rgba(128,128,128,.2)",border:"none",borderRadius:16,color:restoreCode.trim()?"#fff":T.sub,fontSize:15,fontWeight:800,boxShadow:restoreCode.trim()?"0 4px 20px rgba(99,102,241,.4)":"none"}}>
            {lang==="he"?"שחזר נתונים":"Restore Data"}
          </button>
        </BottomSheet>
      </div>
    );
  }

  // ─── TOAST (replaces native alert() for consistent in-app feedback) ────────
  function Toast({message,type,onDone,actionLabel,onAction,duration=2600}){
    useEffect(()=>{const t=setTimeout(onDone,duration);return()=>clearTimeout(t);},[duration]);
    const isError=type==="error";
    return(
      <div style={{
        position:"fixed",bottom:"calc(90px + env(safe-area-inset-bottom,0px))",left:16,right:16,zIndex:300,
        maxWidth:448,margin:"0 auto",
        background:isError?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#22c55e,#16a34a)",
        color:"#fff",padding:"12px 16px",borderRadius:16,fontSize:13,fontWeight:700,
        boxShadow:"0 8px 30px rgba(0,0,0,.35)",animation:"ww-toast-up .25s ease",
        display:"flex",alignItems:"center",justifyContent:actionLabel?"space-between":"center",gap:12,
      }}>
        <span style={{textAlign:actionLabel?"start":"center",flex:actionLabel?1:"none"}}>{message}</span>
        {actionLabel&&<button onClick={()=>{onAction&&onAction();onDone();}} style={{background:"rgba(255,255,255,.22)",border:"none",borderRadius:8,padding:"5px 12px",color:"#fff",fontWeight:800,fontSize:12,flexShrink:0}}>{actionLabel}</button>}
      </div>
    );
  }

  function AccountBubble({ T, lang }) {
    const { user, loading, roomId, setRoomId, recoverToPrivateRoom } = useAuth();
    const [sheetOpen, setSheetOpen] = useState(false);

    const [inviteEmail, setInviteEmail] = useState("");
    const [searchResults, setSearchResults] = useState([]);
    const [searching, setSearching] = useState(false);
    const [invitingId, setInvitingId] = useState(null);
    const [removingId, setRemovingId] = useState(null);
    const [toast, setToast] = useState(null);

    // Email/password auth state
    const [authEmail, setAuthEmail] = useState("");
    const [authPassword, setAuthPassword] = useState("");
    const [isSignUp, setIsSignUp] = useState(false);
    const [authError, setAuthError] = useState("");
    const [resetSent, setResetSent] = useState(false);
    const [showReset, setShowReset] = useState(false);

    const [roomMembers, setRoomMembers] = useState([]);
    const [memberProfiles, setMemberProfiles] = useState({});
    const [membersRetryTick, setMembersRetryTick] = useState(0);

    // Aggregate sync status from every useSyncState listener, reflected as
    // the existing corner dot's color instead of a separate header icon.
    const [syncStatuses, setSyncStatuses] = useState({});
    useEffect(() => {
      const onStatus = (e) => {
        const { key, status } = e.detail;
        setSyncStatuses(prev => ({ ...prev, [key]: status }));
      };
      window.addEventListener('ww_sync_status', onStatus);
      return () => window.removeEventListener('ww_sync_status', onStatus);
    }, []);
    useEffect(() => { setSyncStatuses({}); }, [roomId]);
    const syncVals = Object.values(syncStatuses);
    const syncState = syncVals.includes('error') ? 'error' : syncVals.includes('syncing') ? 'syncing' : 'synced';
    const syncColor = syncState === 'error' ? "#ef4444" : syncState === 'syncing' ? "#fbbf24" : "#4ade80";
    const syncLabel = syncState === 'error'
      ? (lang === "he" ? "בעיית סנכרון" : "Sync issue")
      : syncState === 'syncing'
      ? (lang === "he" ? "מסנכרן..." : "Syncing...")
      : (lang === "he" ? "מסונכרן" : "Synced");

    useEffect(() => {
      if (inviteEmail.trim().length <= 2 || !window.db) {
        setSearchResults([]);
        setSearching(false);
        return;
      }
      setSearching(true);
      const handle = setTimeout(() => {
        const term = inviteEmail.trim().toLowerCase();
        const q = window.query(
          window.collection(window.db, "users"),
          window.where("email", ">=", term),
          window.where("email", "<=", term + "\uf8ff")
        );
        window.getDocs(q).then(snap => {
          setSearchResults(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setSearching(false);
        }).catch(e => {
          console.error(e);
          setSearching(false);
        });
      }, 350);
      return () => clearTimeout(handle);
    }, [inviteEmail]);

    useEffect(() => {
      if (!roomId || !window.db) { setRoomMembers([]); return; }
      let retryTimer = null;
      const roomRef = window.doc(window.db, "rooms", roomId);
      const unsub = window.onSnapshot(roomRef, snap => {
        if (snap.exists()) {
          const data = snap.data();
          setRoomMembers(data.members || []);
        }
      }, err => {
        retryTimer = scheduleSnapshotRetry("room-members", err, setMembersRetryTick);
      });
      return () => { unsub(); if (retryTimer) clearTimeout(retryTimer); };
    }, [roomId, membersRetryTick]);

    useEffect(() => {
      const missing = roomMembers.filter(uid => !memberProfiles[uid]);
      if (!missing.length || !window.db) return;
      Promise.all(missing.map(uid =>
        window.getDoc(window.doc(window.db, "users", uid)).then(s => [uid, s.exists() ? s.data() : null])
      )).then(results => {
        setMemberProfiles(prev => {
          const next = {...prev};
          results.forEach(([uid,data]) => { if (data) next[uid] = data; });
          return next;
        });
      });
    }, [roomMembers]);
    const members = roomMembers.map(uid => {
      const profile = memberProfiles[uid] || {};
      return { id: uid, ...profile, isSelf: user && uid === user.uid };
    });

    const handleGoogleLogin = async () => {
      if (!window.auth) {
        setToast({message: lang === "he" ? "Firebase לא מוגדר. אנא הגדירו מפתחות בקוד." : "Firebase is not configured. Please set up API keys in the code.", type:"error"});
        return;
      }
      try {
        const provider = new window.GoogleAuthProvider();
        await window.signInWithPopup(window.auth, provider, window.browserPopupRedirectResolver);
        setSheetOpen(false);
      } catch (e) {
        console.error(e);
        setAuthError(lang === "he" ? "ההתחברות נכשלה. נסו שוב." : "Sign in failed. Please try again.");
      }
    };

    const handleEmailAuth = async (e) => {
      e.preventDefault();
      if (!window.auth) {
        setToast({message: lang === "he" ? "Firebase לא מוגדר." : "Firebase is not configured.", type:"error"});
        return;
      }
      setAuthError("");
      setResetSent(false);
      try {
        if (isSignUp) {
          const cred = await window.createUserWithEmailAndPassword(window.auth, authEmail, authPassword);
          if (cred.user && window.db) {
            await window.setDoc(window.doc(window.db, "users", cred.user.uid), {
              email: authEmail.toLowerCase(),
              displayName: "",
              photoURL: ""
            }, { merge: true });
          }
          setSheetOpen(false);
          setAuthEmail("");
          setAuthPassword("");
        } else {
          await window.signInWithEmailAndPassword(window.auth, authEmail, authPassword);
          setSheetOpen(false);
          setAuthEmail("");
          setAuthPassword("");
        }
      } catch (e) {
        console.error(e);
        const code = e.code || "";
        if (code === "auth/invalid-email") {
          setAuthError(lang === "he" ? "כתובת האימייל אינה תקינה." : "Invalid email address.");
        } else if (code === "auth/user-not-found" || code === "auth/invalid-credential") {
          setAuthError(lang === "he" ? "אימייל או סיסמה שגויים." : "Incorrect email or password.");
        } else if (code === "auth/wrong-password") {
          setAuthError(lang === "he" ? "סיסמה שגויה." : "Wrong password.");
        } else if (code === "auth/email-already-in-use") {
          setAuthError(lang === "he" ? "האימייל כבר רשום. נסו להתחבר." : "Email already registered. Try signing in.");
        } else if (code === "auth/weak-password") {
          setAuthError(lang === "he" ? "הסיסמה חלשה מדי (לפחות 6 תווים)." : "Password is too weak (at least 6 characters).");
        } else {
          setAuthError(lang === "he" ? "שגיאת התחברות. נסו שוב." : "Authentication error. Please try again.");
        }
      }
    };

    const handlePasswordReset = async () => {
      if (!authEmail.trim()) {
        setAuthError(lang === "he" ? "הזינו אימייל לשחזור סיסמה." : "Enter your email to reset password.");
        return;
      }
      try {
        await window.sendPasswordResetEmail(window.auth, authEmail);
        setResetSent(true);
        setAuthError("");
      } catch (e) {
        setAuthError(lang === "he" ? "שליחת האימייל נכשלה. ודאו שהכתובת תקינה." : "Failed to send reset email. Make sure the address is valid.");
      }
    };

    const handleLogout = async () => {
      if (window.auth) {
        await window.signOut(window.auth);
        const url = new URL(window.location);
        url.searchParams.delete('room');
        window.history.pushState({}, '', url);
        window.location.reload();
      }
    };

    const handleInviteUser = async (targetUser) => {
      haptic(10);
      setInvitingId(targetUser.id);
      try {
        let currentRoomId = roomId;
        if (!currentRoomId || !user || !window.db) return;

        const roomRef = window.doc(window.db, "rooms", currentRoomId);
        const snap = await window.getDoc(roomRef);
        const uids = snap.exists() ? (snap.data().members || []) : [];
        const payload = { [`invited.${targetUser.id}`]: Date.now() };
        if (!uids.includes(targetUser.id)) {
          payload.members = window.arrayUnion(targetUser.id);
        }
        await window.setDoc(roomRef, payload, { merge: true });

        setToast({message: lang === "he" ? "השותף הוזמן בהצלחה!" : "Partner invited successfully!", type:"success"});
        setInviteEmail("");
      } catch (e) {
        console.error(e);
        setToast({message: lang === "he" ? "ההזמנה נכשלה" : "Invite failed", type:"error"});
      } finally {
        setInvitingId(null);
      }
    };

    const handleRemoveMember = async (uid) => {
      if (!window.db || !roomId || !user) return;
      haptic(10);
      setRemovingId(uid);
      try {
        const roomRef = window.doc(window.db, "rooms", roomId);
        const leavingProfile = uid === user.uid ? user : (memberProfiles[uid] || {});
        const leavingName = leavingProfile.displayName || leavingProfile.email || "";
        const noticeId = crypto.randomUUID();

        await window.setDoc(roomRef, {
          members: window.arrayRemove(uid),
          leave_notices: { [noticeId]: { uid, name: leavingName, ts: Date.now(), ackBy: [user.uid] } }
        }, { merge: true });

        if (uid === user.uid) {
          await recoverToPrivateRoom(roomId);
          setToast({message: lang === "he" ? "יצאת מהחדר המשותף. עברת לחדר הפרטי שלך." : "Left shared room. Switched to your private room.", type:"success"});
        } else {
          setToast({message: lang === "he" ? "השותף הוסר" : "Member removed", type:"success"});
        }
      } catch (e) {
        console.error(e);
        setToast({message: lang === "he" ? "הפעולה נכשלה" : "Operation failed", type:"error"});
      } finally {
        setRemovingId(null);
      }
    };

    if (loading) return null;
    const initial = (user?.displayName || user?.email || "?").trim().charAt(0).toUpperCase();

    return<>
      <button onClick={()=>{haptic(8);setSheetOpen(true);}} aria-label={roomId?`${lang==="he"?"חשבון וחדר":"Account & room"} — ${syncLabel}`:(lang==="he"?"חשבון וחדר":"Account & room")} style={{
        width:38,height:38,borderRadius:"50%",padding:0,flexShrink:0,position:"relative",
        background:user&&user.photoURL?"transparent":(user?"linear-gradient(135deg,#6366f1,#8b5cf6)":T.surface),
        border:`2px solid ${user?(roomId?"#4ade80":T.accentB):T.surfaceB}`,
        display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",
      }}>
        {user?(
          user.photoURL
            ?<img src={user.photoURL} alt="" referrerPolicy="no-referrer" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            :<span style={{color:"#fff",fontSize:14,fontWeight:800}}>{initial}</span>
        ):(
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        )}
        {roomId&&user&&<div title={syncLabel} style={{position:"absolute",bottom:-1,insetInlineEnd:-1,width:11,height:11,borderRadius:"50%",background:syncColor,boxShadow:"0 0 0 2px rgba(0,0,0,.35)"}}/>}
      </button>

      <BottomSheet open={sheetOpen} onClose={()=>setSheetOpen(false)} T={T}>
        <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:16,textAlign:"center"}}>
          👥 {lang === "he" ? "שיתוף בזמן אמת" : "Real-time Sharing"}
        </div>
        {user?(<>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"11px 12px",background:T.surface2,borderRadius:12}}>
            {user.photoURL
              ?<img src={user.photoURL} alt="" referrerPolicy="no-referrer" style={{width:42,height:42,borderRadius:"50%",flexShrink:0,objectFit:"cover"}}/>
              :<div style={{width:42,height:42,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:17,fontWeight:800,flexShrink:0}}>{initial}</div>}
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.displayName||user.email}</div>
              {roomId
                ?(roomMembers.length > 1
                    ?<div style={{fontSize:11,color:"#4ade80",fontWeight:600}}>● {lang==="he"?"מחובר לחדר משותף":"Connected to shared room"}</div>
                    :<div style={{fontSize:11,color:"#38bdf8",fontWeight:600}}>☁️ {lang==="he"?"מחובר ומסונכרן לענן":"Logged in & Synced to Cloud"}</div>)
                :<div style={{fontSize:11,color:T.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.email}</div>}
            </div>
          </div>

          {roomId && members.length > 0 && (
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:8}}>{lang==="he"?"משתמשים בחדר":"Room Members"}</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {members.map(m=>{
                  const mInitial=(m.displayName||m.email||"?").trim().charAt(0).toUpperCase();
                  return(
                    <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:T.surface2,borderRadius:12}}>
                      {m.photoURL
                        ?<img src={m.photoURL} alt="" referrerPolicy="no-referrer" style={{width:32,height:32,borderRadius:"50%",objectFit:"cover",flexShrink:0}}/>
                        :<div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,fontWeight:800,flexShrink:0}}>{mInitial}</div>}
                      <div style={{flex:1,minWidth:0,fontSize:13,fontWeight:600,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {m.displayName||m.email||"…"}{m.isSelf?(lang==="he"?" (את/ה)":" (you)"):""}
                      </div>
                      {(!m.isSelf || roomMembers.length > 1) && (
                        <button onClick={()=>handleRemoveMember(m.id)} disabled={removingId===m.id} style={{padding:"5px 10px",background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:8,color:"#ef4444",fontSize:11,fontWeight:700,flexShrink:0,opacity:removingId===m.id?.5:1}}>
                          {removingId===m.id?"…":(m.isSelf?(lang==="he"?"עזוב":"Leave"):(lang==="he"?"הסר":"Remove"))}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div style={{marginBottom: 16}}>
            <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:6}}>{lang === "he" ? "הזמן באמצעות אימייל" : "Invite by Email"}</div>
            <input type="email" placeholder={lang === "he" ? "הזן אימייל של שותף..." : "Enter partner's email..."}
              value={inviteEmail} onChange={e => setInviteEmail(e.target.value)}
              dir="ltr" autoCapitalize="none" autoCorrect="off" autoComplete="email" spellCheck="false"
              style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:14,outline:"none",marginBottom:8,textAlign:lang==="he"?"right":"left"}}/>

            {inviteEmail.trim().length > 2 && (
              <div style={{background:T.surface2, borderRadius:12, overflow:"hidden", border:`1px solid ${T.surface2B}`}}>
                {searching && <div style={{padding:10, fontSize:12, color:T.sub, textAlign:"center"}}>{lang === "he" ? "מחפש..." : "Searching..."}</div>}
                {!searching && searchResults.length === 0 && (
                  <div style={{padding:16, textAlign:"center"}}>
                    <div style={{fontSize:13, color:T.text, marginBottom:8}}>
                      {lang === "he" ? "לא נמצא משתמש." : "User not found."}
                    </div>
                    <div style={{fontSize:12, color:T.sub, marginBottom:12}}>
                      {lang === "he" ? "השותף חייב להתחבר לפחות פעם אחת לאפליקציה כדי שתוכל להזמין אותו. שלח לו קישור התחברות:" : "The partner must sign in to the app at least once before you can invite them. Send them a login link:"}
                    </div>
                    <button onClick={() => {
                      const shareUrl = window.location.origin;
                      if (navigator.share) {
                        navigator.share({ title: 'Join Wonder Weeks', url: shareUrl }).catch(e => {
                          if (e.name !== 'AbortError') console.error(e);
                        });
                      } else {
                        navigator.clipboard.writeText(shareUrl);
                        setToast({message: lang === "he" ? "הקישור הועתק ללוח" : "Link copied to clipboard", type:"success"});
                      }
                    }} style={{padding:"8px 16px", background:T.surface, color:T.text, borderRadius:8, fontSize:12, fontWeight:700, border:`1px solid ${T.surfaceB}`}}>
                      🔗 {lang === "he" ? "שלח קישור לאפליקציה" : "Send App Link"}
                    </button>
                  </div>
                )}
                {!searching && searchResults.map(u => {
                  const isSelf = user && u.id === user.uid;
                  const alreadyAdded = roomId && roomMembers.includes(u.id);
                  return(
                    <div key={u.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", borderBottom:`1px solid ${T.surface2B}`}}>
                      <div style={{display:"flex", alignItems:"center", gap:8, minWidth:0}}>
                        {u.photoURL ? <img src={u.photoURL} alt="" referrerPolicy="no-referrer" style={{width:30,height:30,borderRadius:"50%",objectFit:"cover",flexShrink:0}}/> : <div style={{width:30,height:30,borderRadius:"50%",background:T.accentBg,color:T.accentText,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,flexShrink:0}}>{(u.email||"?").charAt(0).toUpperCase()}</div>}
                        <div style={{fontSize:13, color:T.text, fontWeight:600, overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {u.email} {isSelf && <span style={{fontSize:11, color:T.sub, fontWeight:500, marginInlineStart:4}}>{lang==="he"?"(את/ה)":"(You)"}</span>}
                        </div>
                      </div>
                      {isSelf ? (
                        <span style={{fontSize:11,color:T.sub,fontWeight:700,flexShrink:0,marginInlineStart:8}}>{lang==="he"?"(את/ה)":"(You)"}</span>
                      ) : alreadyAdded ? (
                        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,marginInlineStart:8}}>

              style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:16,outline:"none"}}/>
          </div>
          {/* Birth date */}
          <div>
            <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:8}}>📅 {S.settings.birthDate}</div>
            <input type="date" value={birthDate} max={today} min={earliest}
              onChange={e=>{const v=e.target.value;setBirthDate(v);if(v)localStorage.setItem("ww_date",v);else localStorage.removeItem("ww_date");}}
              style={{width:"100%",padding:"11px 14px",background:T.input,border:`1px solid ${T.inputB}`,borderRadius:12,color:T.inputText,fontSize:16,outline:"none",colorScheme:T.ds}}/>
            <div style={{fontSize:11,color:T.muted,marginTop:6}}>{S.settings.birthHint}</div>
          </div>
          {/* Theme */}
          <div>
            <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:8}}>🎨 {S.settings.theme}</div>

                  {label}
                </button>
              ))}
            </div>
          </div>
          {/* Language */}
          <div>
            <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:8}}>🌐 {S.settings.lang}</div>
            <div style={{display:"flex",gap:8}}>
              {[["he","🇮🇱 עברית"],["en","🇬🇧 English"]].map(([l,label])=>(

          </div>
        </div>}
      </div>
    );

  // Wraps a single tab so a crash inside it (e.g. a bad Firestore payload)
  // shows an inline fallback instead of unmounting the whole app to a white
  // screen — same failure mode that hit the analytics fallback before.
  class ErrorBoundary extends React.Component {
    constructor(props){ super(props); this.state = { hasError: false }; }
    static getDerivedStateFromError(){ return { hasError: true }; }
    componentDidCatch(error, info){ console.error("Tab crashed:", error, info); }
    render(){
      if (this.state.hasError) {
        const { T, lang } = this.props;
        return (
          <div style={{padding:"48px 24px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,textAlign:"center"}}>
            <div style={{fontSize:15,fontWeight:800,color:T.text}}>{lang==="he"?"אופס, משהו השתבש":"Something went wrong"}</div>
            <div style={{fontSize:12.5,color:T.sub,lineHeight:1.6,maxWidth:280}}>{lang==="he"?"הטאב הזה נתקל בשגיאה. שאר האפליקציה ממשיכה לפעול כרגיל.":"This tab hit an error. The rest of the app keeps working."}</div>
            <button onClick={()=>this.setState({hasError:false})} style={{padding:"10px 22px",background:T.accentBg,border:`1px solid ${T.accentB}`,borderRadius:12,color:T.accentText,fontSize:13,fontWeight:700}}>
              {lang==="he"?"נסה שוב":"Try again"}
            </button>
          </div>
        );
      }
      return this.props.children;
    }
  }

  // ─── APP ─────────────────────────────────────────────────────────────────────
  function App(){
    const { pendingRoomInvite, acceptRoomInvite, declineRoomInvite, leaveNotice, ackLeaveNotice } = useAuth();
    const[isDark,setIsDark]=useState(()=>{const d=localStorage.getItem("ww_theme")!=="light";document.body.style.background=d?"#0a0f1e":"#faf8f5";return d;});
    const[lang,setLang]=useState(()=>loadLS("ww_lang","he"));
    const[birthDate,setBirthDate]=useSyncState("ww_date","");
    const[babyName,setBabyName]=useSyncState("ww_babyname","");
    const[sleeps,setSleeps]=useSyncState("ww_sleeps",[]);
    const[feeds,setFeeds]=useSyncState("ww_feeds",[]);
    const[weights,setWeights]=useSyncState("ww_weights",[]);
    const[sunTimes,setSunTimes]=useState(()=>loadLS("ww_suntimes",null));
    useEffect(()=>{
      const STALE_AFTER=14*24*60*60*1000; // 14 days — location rarely changes meaningfully, sunrise/sunset tolerate approx fine
      const cachedGeo=loadLS("ww_geo",null);
      if(cachedGeo&&Date.now()-cachedGeo.ts<STALE_AFTER){
        const st=calcSunTimes(cachedGeo.lat,cachedGeo.lng);
        setSunTimes(st); saveLS("ww_suntimes",st);
        return;
      }
      if(!navigator.geolocation)return;
      navigator.geolocation.getCurrentPosition(
        pos=>{
          const{latitude:lat,longitude:lng}=pos.coords;
          saveLS("ww_geo",{lat,lng,ts:Date.now()});
          const st=calcSunTimes(lat,lng);
          setSunTimes(st); saveLS("ww_suntimes",st);
        },
        ()=>{}, {timeout:8000,maximumAge:3600000}
      );
    },[]);
    const[activeTab,setActiveTab]=useState("leaps");
    const[installPrompt,setInstallPrompt]=useState(null);
    const[installed,setInstalled]=useState(false);
    const[aboutOpen,setAboutOpen]=useState(false);

    useEffect(()=>saveLS("ww_lang",lang),[lang]);
    useEffect(()=>{window.logAnalyticsEvent("app_visited");},[]);
    useEffect(()=>{
      const h=e=>{e.preventDefault();setInstallPrompt(e);};
      window.addEventListener("beforeinstallprompt",h);
      window.addEventListener("appinstalled",()=>{
        setInstalled(true);
        setInstallPrompt(null);
        window.logAnalyticsEvent("app_installed");
      });
      return()=>window.removeEventListener("beforeinstallprompt",h);
    },[]);

    const toggleTheme=()=>{haptic(10);setIsDark(d=>{const n=!d;localStorage.setItem("ww_theme",n?"dark":"light");document.body.style.background=n?"#0a0f1e":"#faf8f5";return n;});};
    const doInstall=()=>{if(!installPrompt)return;haptic(10);installPrompt.prompt();installPrompt.userChoice.then(()=>setInstallPrompt(null));};

    const T=isDark?DARK:LIGHT;
    const S=LANG[lang];

    const TAB_ORDER=["leaps","sleep","feed","settings"];
    const[tabAnim,setTabAnim]=useState(null);
    const setTabAndSave=id=>{
      if(id===activeTab)return;
      const pi=TAB_ORDER.indexOf(activeTab), ni=TAB_ORDER.indexOf(id);
      setTabAnim(ni>pi?1:-1);
      haptic(8);
      setActiveTab(id);
    };
    const dir=lang==="he"?"rtl":"ltr";

    return<div dir={dir} style={{minHeight:"100vh",minHeight:"100dvh",background:T.bg,overflowX:"hidden",transition:"background .3s",paddingBottom:80}}>
      {pendingRoomInvite && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,zIndex:9999}}>
          <div style={{maxWidth:360,width:"100%",background:T.surface,border:`1px solid ${T.surfaceB}`,borderRadius:16,padding:22,textAlign:"center"}}>
            <div style={{fontSize:34,marginBottom:10}}>👥</div>
            <h2 style={{fontSize:18,fontWeight:800,color:T.text,marginBottom:10}}>
              {lang==="he"?"הוזמנת לחדר משותף":"You've been invited to a shared room"}
            </h2>
            <p style={{fontSize:13,color:T.sub,lineHeight:1.6,marginBottom:20}}>
              {lang==="he"
                ?"שותף הזמין אותך לשתף נתונים בזמן אמת. אישור ימזג את הנתונים שלכם עם נתוני השותף — רשומות חופפות שאינן זהות יסומנו 🚩 לבדיקה ידנית. אפשר לצאת מהחדר בכל שלב."
                :"A partner invited you to share data in real time. Accepting will merge your data with theirs — overlapping-but-different records will be flagged 🚩 for manual review. You can leave the shared room again at any time."}
            </p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={declineRoomInvite} style={{flex:1,padding:"12px 0",background:T.surface2,border:`1px solid ${T.surface2B}`,borderRadius:12,color:T.sub,fontWeight:700,fontSize:14}}>
                {lang==="he"?"דחה":"Decline"}
              </button>
              <button onClick={acceptRoomInvite} style={{flex:1,padding:"12px 0",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",borderRadius:12,color:"#fff",fontWeight:800,fontSize:14}}>
                {lang==="he"?"אשר":"Accept"}
              </button>
            </div>
          </div>
        </div>
      )}
      {!pendingRoomInvite && leaveNotice && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,zIndex:9999}}>
          <div style={{maxWidth:360,width:"100%",background:T.surface,border:`1px solid ${T.surfaceB}`,borderRadius:16,padding:22,textAlign:"center"}}>

                :`${leaveNotice.name||"A partner"} left the shared room.`}
            </p>
            <button onClick={ackLeaveNotice} style={{width:"100%",padding:"12px 0",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",borderRadius:12,color:"#fff",fontWeight:800,fontSize:14}}>
              {lang==="he"?"הבנתי":"Got it"}
            </button>
          </div>
        </div>
      )}
      <style>{`
        @keyframes sl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
        @keyframes sr{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
        @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes ww-toast-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        input[type=date]{color-scheme:${T.ds}}
        button{transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .15s}
        button:active{transform:scale(.95)!important;opacity:.85}
      `}</style>
      <Stars isDark={isDark}/>
      <div style={{position:"relative",zIndex:1,maxWidth:480,margin:"0 auto",padding:"calc(14px + env(safe-area-inset-top,0px)) 14px 0",animation:"fadeUp .4s ease"}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>{haptic(8);setAboutOpen(true);}} aria-label={lang==="he"?"אודות":"About"} style={{width:38,height:38,borderRadius:12,background:T.accentBg,display:"flex",alignItems:"center",justifyContent:"center",filter:T.glow,padding:0,flexShrink:0}}>
              <IconMoonStar size={19} color={T.accentText}/>
            </button>
            <div><div style={{fontSize:17,fontWeight:900,color:T.h1,letterSpacing:"-.02em",textShadow:T.h1s}}>{S.appName}</div><div style={{fontSize:11,color:T.sub}}>{S.appSub}</div></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={toggleTheme} aria-label={isDark?(lang==="he"?"עבור למצב בהיר":"Switch to light mode"):(lang==="he"?"עבור למצב כהה":"Switch to dark mode")} style={{background:T.surface,border:`1px solid ${T.surfaceB}`,borderRadius:12,padding:"8px 11px",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {isDark?<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              :<IconMoonStar size={16} color={T.sub}/>}
            </button>
            <AccountBubble T={T} lang={lang}/>
          </div>
        </div>

        <BottomSheet open={aboutOpen} onClose={()=>setAboutOpen(false)} T={T}>
          <div style={{textAlign:"center",padding:"6px 0 4px"}}>
            <div style={{width:64,height:64,borderRadius:16,background:T.accentBg,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",filter:T.glow}}>
              <IconMoonStar size={30} color={T.accentText}/>
            </div>
            <div style={{fontSize:18,fontWeight:900,color:T.text,marginBottom:4}}>{S.appName}</div>
            <div style={{fontSize:12,color:T.sub,marginBottom:16}}>{S.appSub}</div>
            <div style={{display:"inline-block",padding:"6px 14px",background:T.surface2,borderRadius:999,border:`1px solid ${T.surface2B}`,fontSize:12.5,fontWeight:700,color:T.sub}}>
              {lang==="he"?`גרסה ${APP_VERSION}`:`Version ${APP_VERSION}`}
            </div>
          </div>
        </BottomSheet>

        {/* Tab content */}
        <div key={activeTab} style={{animation:tabAnim===1?"sl .3s cubic-bezier(.22,1,.36,1)":tabAnim===-1?"sr .3s cubic-bezier(.22,1,.36,1)":"fadeUp .3s ease"}}>
          {activeTab==="leaps"&&<ErrorBoundary T={T} lang={lang}><LeapsTab T={T} S={S} lang={lang} birthDate={birthDate} setTab={setTabAndSave}/></ErrorBoundary>}
          {activeTab==="sleep"&&<ErrorBoundary T={T} lang={lang}><SleepTab T={T} S={S} lang={lang} sunTimes={sunTimes} sleeps={sleeps} setSleeps={setSleeps}/></ErrorBoundary>}
          {activeTab==="feed"&&<ErrorBoundary T={T} lang={lang}><FeedTab T={T} S={S} lang={lang} feeds={feeds} setFeeds={setFeeds} weights={weights}/></ErrorBoundary>}
          {activeTab==="settings"&&<ErrorBoundary T={T} lang={lang}><SettingsTab T={T} S={S} lang={lang} setLang={setLang} isDark={isDark} toggleTheme={toggleTheme} birthDate={birthDate} setBirthDate={setBirthDate} babyName={babyName} setBabyName={setBabyName} installPrompt={installPrompt} installed={installed} doInstall={doInstall} weights={weights} setWeights={setWeights}/></ErrorBoundary>}
        </div>
      </div>
      <BottomNav activeTab={activeTab} setTab={setTabAndSave} T={T} S={S} lang={lang}/>
    </div>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<AuthProvider><AuthGuard><App/></AuthGuard></AuthProvider>);
  </script>
</body>
</html>
