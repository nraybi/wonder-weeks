  <script type="text/babel">
  const {useState,useEffect,useCallback,useRef,useMemo}=React;

  const AuthContext = React.createContext({ user: null, loading: true, roomId: null, setRoomId: () => {} });
  function markRoomKnown(id) {
    if (!id) return;
    const known = loadLS("ww_known_rooms", []);
    if (!known.includes(id)) saveLS("ww_known_rooms", [...known, id]);
  }
  function AuthProvider({ children }) {
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);
    const [roomId, setRoomId] = useState(() => new URLSearchParams(window.location.search).get('room'));
    const [pendingRoomInvite, setPendingRoomInvite] = useState(null);

    useEffect(() => {
      if (!window.auth) {
        setLoading(false);
        return;
      }
      return window.onAuthStateChanged(window.auth, async (u) => {
        setUser(u);
        if (u && window.db) {
          window.setDoc(window.doc(window.db, "users", u.uid), {
            email: (u.email || "").toLowerCase(),
            displayName: u.displayName,
            photoURL: u.photoURL
          }, { merge: true }).catch(console.error);

          const paramRoomId = new URLSearchParams(window.location.search).get('room');
          if (paramRoomId) {
            markRoomKnown(paramRoomId);
            setRoomId(paramRoomId);
          } else {
            try {
              const q = window.query(
                window.collection(window.db, "rooms"),
                window.where("members", "array-contains", u.uid)
              );
              const snap = await window.getDocs(q);
              const activeDocs = snap.docs.filter(d => !d.data().scheduled_deletion);
              if (activeDocs.length > 0) {
                const autoRoomId = activeDocs[0].id;
                markRoomKnown(autoRoomId);
                setRoomId(autoRoomId);
                const url = new URL(window.location);
                url.searchParams.set('room', autoRoomId);
                window.history.replaceState({}, '', url);
              } else {
                const newRoomId = crypto.randomUUID();
                const initialRoom = {
                  members: [u.uid],
                  ww_sleeps: loadLS("ww_sleeps", []),
                  ww_feeds: loadLS("ww_feeds", []),
                  ww_weights: loadLS("ww_weights", []),
                  ww_babyname: loadLS("ww_babyname", ""),
                  ww_date: loadLS("ww_date", ""),
                  created_at: Date.now()
                };
                await window.setDoc(window.doc(window.db, "rooms", newRoomId), initialRoom);
                markRoomKnown(newRoomId);
                setRoomId(newRoomId);
                const url = new URL(window.location);
                url.searchParams.set('room', newRoomId);
                window.history.replaceState({}, '', url);
              }
            } catch (e) {
              console.error("Auto sync room resolution error:", e);
            }
          }
        }
        setLoading(false);
      });
    }, []);

    // Live invite detection: keep listening for OTHER rooms this account gets
    // added to (e.g. a partner just invited them) while already signed in.
    // A room only counts as a fresh invite if we've never been in it before
    // (ww_known_rooms), AND either we've never declined it, or the owner has
    // invited us again (a newer room.invited[uid] timestamp) since we declined.
    useEffect(() => {
      if (!user || !window.db || !roomId) return;
      const q = window.query(
        window.collection(window.db, "rooms"),
        window.where("members", "array-contains", user.uid)
      );
      const unsub = window.onSnapshot(q, snap => {
        const known = loadLS("ww_known_rooms", []);
        const ignored = loadLS("ww_ignored_rooms", {});
        const candidate = snap.docs.find(d => {
          if (d.id === roomId || known.includes(d.id) || d.data().scheduled_deletion) return false;
          const declinedAt = ignored[d.id];
          if (declinedAt === undefined) return true;
          const invitedAt = (d.data().invited || {})[user.uid];
          return !!invitedAt && invitedAt > declinedAt;
        });
        setPendingRoomInvite(candidate ? candidate.id : null);
      });
      return unsub;
    }, [user?.uid, roomId]);

    const acceptRoomInvite = () => {
      if (!pendingRoomInvite) return;
      // Simple overwrite, not a smart merge: wipe local tracking data first so
      // the incoming room's data replaces it outright instead of interleaving
      // with whatever this device had in its own (now-abandoned) room.
      localStorage.removeItem("ww_sleeps");
      localStorage.removeItem("ww_feeds");
      localStorage.removeItem("ww_weights");
      localStorage.removeItem("ww_deleted_ids");
      window.dispatchEvent(new Event('ww_local_data_restored'));
      const url = new URL(window.location);
      url.searchParams.set('room', pendingRoomInvite);
      window.history.replaceState({}, '', url);
      markRoomKnown(pendingRoomInvite);
      setRoomId(pendingRoomInvite);
      setPendingRoomInvite(null);
    };
    const declineRoomInvite = () => {
      if (!pendingRoomInvite) return;
      const ignored = loadLS("ww_ignored_rooms", {});
      saveLS("ww_ignored_rooms", { ...ignored, [pendingRoomInvite]: Date.now() });
      setPendingRoomInvite(null);
    };

    return <AuthContext.Provider value={{ user, loading, roomId, setRoomId, pendingRoomInvite, acceptRoomInvite, declineRoomInvite }}>
      {children}
    </AuthContext.Provider>;
  }
  function useAuth() { return React.useContext(AuthContext); }

  function mergeArrayData(localList = [], cloudList = [], deletedIdsMap = {}) {
    const mergedMap = new Map();
    const getItemTime = (item) => {
      if (!item) return 0;
      return item.updatedAt || item.start || item.date || item.id || 0;
    };

    for (const item of (cloudList || [])) {
      if (!item || item.id === undefined || item.id === null) continue;
      const strId = String(item.id);
      if (deletedIdsMap[strId]) continue;
      mergedMap.set(strId, item);
    }

    for (const item of (localList || [])) {
      if (!item || item.id === undefined || item.id === null) continue;
      const strId = String(item.id);
      if (deletedIdsMap[strId]) continue;

      const existing = mergedMap.get(strId);
      if (!existing) {
        mergedMap.set(strId, item);
      } else {
        const localTime = getItemTime(item);
        const cloudTime = getItemTime(existing);
        if (localTime > cloudTime) {
          mergedMap.set(strId, item);
        } else if (localTime === cloudTime) {
          mergedMap.set(strId, { ...existing, ...item });
        }
      }
    }

    return Array.from(mergedMap.values());
  }

  // Pure merge/compare logic, kept separate from the onSnapshot listener in
  // useSyncState so the listener's job is only: read snapshot -> decide via
  // these -> apply (setState/saveLS) -> write back if needed.
  function reconcileArrayField(key, cloudData, localVal) {
    const localArr = Array.isArray(localVal) ? localVal : [];
    const cloudArr = Array.isArray(cloudData[key]) ? cloudData[key] : [];
    const localDeleted = loadLS("ww_deleted_ids", {});
    const cloudDeleted = cloudData.ww_deleted_ids || {};
    const mergedDeleted = { ...localDeleted, ...cloudDeleted };
    const mergedArr = mergeArrayData(localArr, cloudArr, mergedDeleted);
    const needsWrite = JSON.stringify(cloudArr) !== JSON.stringify(mergedArr)
      || JSON.stringify(cloudDeleted) !== JSON.stringify(mergedDeleted);
    return { mergedArr, mergedDeleted, needsWrite };
  }

  function reconcileScalarField(cloudVal, localVal) {
    if (cloudVal !== undefined && cloudVal !== null && cloudVal !== "") {
      return { value: cloudVal, saveLocal: true, needsWrite: false };
    }
    if (localVal !== undefined && localVal !== null && localVal !== "") {
      return { value: localVal, saveLocal: false, needsWrite: true };
    }
    return null;
  }

  function useSyncState(key, initialValue) {
    const { roomId, user } = useAuth();
    const [state, setState] = useState(() => loadLS(key, initialValue));

    useEffect(() => {
      const handleLocalRestored = () => {
        const localVal = loadLS(key, initialValue);
        setState(localVal);
      };
      window.addEventListener('ww_local_data_restored', handleLocalRestored);
      return () => {
        window.removeEventListener('ww_local_data_restored', handleLocalRestored);
      };
    }, [key]);

    useEffect(() => {
      if (!roomId || !user || !window.db) return;

      const roomRef = window.doc(window.db, "rooms", roomId);
      const unsubscribe = window.onSnapshot(roomRef, (docSnap) => {
        if (!docSnap.exists()) return;

        const cloudData = docSnap.data();
        const cloudVal = cloudData[key];
        const localVal = loadLS(key, initialValue);

        if (Array.isArray(initialValue) || Array.isArray(localVal) || Array.isArray(cloudVal)) {
          const { mergedArr, mergedDeleted, needsWrite } = reconcileArrayField(key, cloudData, localVal);

          saveLS("ww_deleted_ids", mergedDeleted);
          saveLS(key, mergedArr);
          setState(mergedArr);

          if (needsWrite) {
            window.setDoc(roomRef, {
              [key]: mergedArr,
              ww_deleted_ids: mergedDeleted
            }, { merge: true }).catch(console.error);
          }
        } else {
          const result = reconcileScalarField(cloudVal, localVal);
          if (result) {
            setState(result.value);
            if (result.saveLocal) saveLS(key, result.value);
            if (result.needsWrite) {
              window.setDoc(roomRef, { [key]: result.value }, { merge: true }).catch(console.error);
            }
          }
        }
      }, (err) => {
        console.error("Snapshot error for", key, err);
      });

      return () => unsubscribe();
    }, [roomId, user?.uid, key]);

    const setSyncedState = useCallback((newValue) => {
      setState(prev => {
        const updated = typeof newValue === 'function' ? newValue(prev) : newValue;
        saveLS(key, updated);

        if (roomId && user && window.db) {
          const roomRef = window.doc(window.db, "rooms", roomId);
          const payload = { [key]: updated };

          if (Array.isArray(prev) && Array.isArray(updated)) {
            const updatedIds = new Set(updated.filter(i => i && i.id !== undefined && i.id !== null).map(i => String(i.id)));
            const deletedMap = loadLS("ww_deleted_ids", {});
            let changedDeleted = false;
            for (const item of prev) {
              if (item && item.id !== undefined && item.id !== null) {
                const strId = String(item.id);
                if (!updatedIds.has(strId)) {
                  deletedMap[strId] = Date.now();
                  changedDeleted = true;
                }
              }
            }
            if (changedDeleted) {
              saveLS("ww_deleted_ids", deletedMap);
              payload.ww_deleted_ids = deletedMap;
            }
          }

          window.setDoc(roomRef, payload, { merge: true }).catch(console.error);
        }
        return updated;
      });
    }, [roomId, user?.uid, key]);

    return [state, setSyncedState];
  }

  function AuthGuard({ children }) {
    const { user, loading, roomId } = useAuth();
    const lang = loadLS("ww_lang", "he");
    const [accessStatus, setAccessStatus] = useState("pending");
    
    useEffect(() => {
      if (!roomId) {
        setAccessStatus("granted");
        return;
      }
      if (user && window.db) {
        window.getDoc(window.doc(window.db, "rooms", roomId)).then(snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.members?.includes(user.uid)) {
              setAccessStatus("granted");
            } else {
              setAccessStatus("denied");
            }
          } else {
            setAccessStatus("granted");
          }
        }).catch(e => {
          console.error(e);
          setAccessStatus("denied");
        });
      } else {
        setAccessStatus("granted");
      }
    }, [user, roomId]);

    if (!roomId || !user) return children;
    if (loading || accessStatus === "pending") return null;

    if (accessStatus === "denied") {
      return (
        <div style={{position:"fixed",inset:0,background:"#0a0f1e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,color:"#fff",zIndex:9999}}>
          <h2 style={{fontSize:22,marginBottom:12,fontWeight:800,color:"#ef4444"}}>{lang === "he" ? "גישה נדחתה" : "Access Denied"}</h2>
          <p style={{fontSize:14,color:"#94a3b8",textAlign:"center",marginBottom:24,lineHeight:1.6}}>
            {lang === "he" ? "אינך מורשה לגשת לחדר זה. בקש מבעל החדר להזמין אותך באמצעות כתובת האימייל שלך." : "You are not authorized to access this room. Ask the room owner to invite you using your email address."}
          </p>
          <button onClick={() => {
            window.location.href = '/';
          }} 
            style={{padding:"14px 24px",background:"#334155",borderRadius:16,color:"#fff",fontWeight:800,fontSize:16,border:"none"}}>
            {lang === "he" ? "חזור לדף הבית" : "Return to Home"}
          </button>
        </div>
      );
    }

    return children;
  }

  function buildWeekMap(){
    const map={};
    for(let w=0;w<=84;w++)map[w]={status:"sunny",leap:null};
    for(const leap of LEAPS){
      if(leap.isGrey){for(let w=leap.restlessStart;w<=leap.restlessEnd;w++)map[w]={status:"grey",leap};}
      else{

  // NOAA solar calculation — returns {sunriseMin, sunsetMin} in local minutes-of-day
  function calcSunTimes(lat,lng,date){
    const d=date||new Date();
    const N=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
    const lngHour=lng/15;
    const calc=(isRise)=>{
      const t=N+((isRise?6:18)-lngHour)/24;
      const M=(0.9856*t)-3.289;
      let L=M+(1.916*Math.sin(M*Math.PI/180))+(0.020*Math.sin(2*M*Math.PI/180))+282.634;
      L=(L+360)%360;
      let RA=(180/Math.PI)*Math.atan(0.91764*Math.tan(L*Math.PI/180));
      RA=(RA+360)%360;
      const Lq=Math.floor(L/90)*90, RAq=Math.floor(RA/90)*90;
      RA=RA+(Lq-RAq); RA/=15;
      const sinDec=0.39782*Math.sin(L*Math.PI/180);
      const cosDec=Math.cos(Math.asin(sinDec));
      const cosH=(Math.cos(90.833*Math.PI/180)-(sinDec*Math.sin(lat*Math.PI/180)))/(cosDec*Math.cos(lat*Math.PI/180));
      if(cosH>1||cosH<-1)return null; // sun never rises/sets (polar)
      let H=isRise?360-(180/Math.PI)*Math.acos(cosH):(180/Math.PI)*Math.acos(cosH);
      H/=15;
      const T=H+RA-(0.06571*t)-6.622;
      let UT=(T-lngHour+24)%24;
      return UT;
    };
    const utToLocalMin=(ut)=>{
      const utcDate=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0));
      utcDate.setUTCMinutes(utcDate.getUTCMinutes()+Math.round(ut*60));
      return utcDate.getHours()*60+utcDate.getMinutes();
    };
    const riseUT=calc(true), setUT=calc(false);
    return{
      sunriseMin:riseUT!==null?utToLocalMin(riseUT):360,
      sunsetMin:setUT!==null?utToLocalMin(setUT):1200,
    };
  }

  // ─── PATTERN GRID (7-day heatmap) ────────────────────────────────────────────
  function PatternGrid({events,color,bgColor,T,S,type}){
    const[ready,setReady]=useState(false);
    useEffect(()=>{const t=setTimeout(()=>setReady(true),240);return()=>clearTimeout(t);},[]);

    const days=useMemo(()=>{
      const result=[];
      const now=Date.now();
      for(let i=6;i>=0;i--){
        const dayStart=startOfDay(now-i*86400000);
        const dayEnd=dayStart+86400000;
        const prevDayStart=dayStart-86400000;
        // Events that start within this day
        const startsToday=events.filter(e=>e.start>=dayStart&&e.start<dayEnd);
        // Events that started the PREVIOUS day but whose end (or "now" if ongoing)
        // crosses into this day — these get a continuation sliver at the top.
        const continuesFromPrev=events.filter(e=>{
          if(e.start<prevDayStart||e.start>=dayStart)return false;
          const effectiveEnd=e.end||now;
          return effectiveEnd>=dayStart;
        });
        result.push({dayStart,startsToday,continuesFromPrev});
      }
      return result;
    },[events]);

    const CELL_H=200; // pixels representing 24h
    const dayNames=S[type].days;

    if(!ready)return<div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`}}>
      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:10}}>{S[type].patternTitle}</div>
      <div style={{display:"flex",gap:4}}>
        {Array.from({length:7},(_,i)=><div key={i} style={{flex:1}}><Shimmer height={CELL_H} T={T}/></div>)}
      </div>
    </div>;

    return<div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`,animation:"fadeUp .3s ease"}}>
      <div style={{fontSize:12,fontWeight:700,color:T.sub,marginBottom:10}}>{S[type].patternTitle}</div>
      <div style={{display:"flex",gap:4}}>
        {/* Time axis — absolutely positioned at exact 0/25/50/75/100% so it always
            lines up with the hour grid-lines inside each day column, regardless of
            the day-name label row's height below. */}
        <div style={{display:"flex",flexDirection:"column",flexShrink:0}}>
          <div style={{position:"relative",height:CELL_H,width:20}}>
            {[["00",0],["06",25],["12",50],["18",75],["24",100]].map(([h,pct])=>(
              <div key={h} style={{position:"absolute",top:`${pct}%`,transform:pct===0?"translateY(0)":pct===100?"translateY(-100%)":"translateY(-50%)",fontSize:9,color:T.muted,lineHeight:1}}>{h}</div>
            ))}
          </div>
          <div style={{height:17}}/>
        </div>
        {/* Day columns */}
        {days.map(({dayStart,startsToday,continuesFromPrev},di)=>{
          const dayLabel=dayNames[(new Date(dayStart)).getDay()];
          return<div key={di} style={{flex:1,display:"flex",flexDirection:"column",gap:3}}>
            <div style={{height:CELL_H,background:T.surface2,borderRadius:6,position:"relative",overflow:"hidden"}}>
              {/* Hour grid lines */}
              {[6,12,18].map(h=><div key={h} style={{position:"absolute",left:0,right:0,top:`${(h/24)*100}%`,height:1,background:"rgba(128,128,128,.12)"}}/>)}
              {type==="sleep"&&startsToday.map((ev,ei)=>{
                const startMin=minutesInDay(ev.start);
                const crossesMidnight=ev.end?(dayKey(ev.end)!==dayKey(ev.start)):(dayKey(Date.now())!==dayKey(ev.start));
                const endMin=crossesMidnight?1440:(ev.end?minutesInDay(ev.end):Math.min(minutesInDay(ev.start)+60,1440));
                const durMin=endMin-startMin;
                const topPct=(startMin/1440)*100;
                const hPct=Math.max((durMin/1440)*100,1.5);
                return<div key={"s"+ei} style={{position:"absolute",left:2,right:2,top:`${topPct}%`,height:`${hPct}%`,background:color,borderRadius:3,opacity:.85}}/>;
              })}
              {type==="sleep"&&continuesFromPrev.map((ev,ei)=>{
                const endMin=ev.end?minutesInDay(ev.end):minutesInDay(Date.now());
                const hPct=Math.max((endMin/1440)*100,1.5);
                return<div key={"c"+ei} style={{position:"absolute",left:2,right:2,top:0,height:`${hPct}%`,background:color,borderRadius:3,opacity:.85}}/>;
              })}
              {type==="feed"&&startsToday.map((ev,ei)=>{
                const min=minutesInDay(ev.start);
                const topPct=(min/1440)*100;
                return<div key={ei} style={{position:"absolute",left:2,right:2,top:`calc(${topPct}% - 3px)`,height:6,background:color,borderRadius:3,opacity:.9}}/>;
              })}
            </div>
            <div style={{fontSize:10,color:T.sub,textAlign:"center",fontWeight:600}}>{dayLabel}</div>
          </div>;
        })}
      </div>
    </div>;
  }

  // ─── CIRCULAR TIMELINE CANVAS ───────────────────────────────────────────────
  // Capsule sleep blocks sit ON the arc; dashed = predicted; solid = logged
  function CircularTimeline({sleeps,activeSleep,nextPred,now,onToggle,S,lang,sunTimes}){
    const sunriseMin=sunTimes?.sunriseMin??360;
    const sunsetMin=sunTimes?.sunsetMin??1200;
    const canvasRef=useRef(null);
    const SIZE=320;
    const CX=SIZE/2, CY=SIZE/2;
    const R=118; // track radius
    const todayStart=startOfDay(Date.now());
    const dayEndTs=todayStart+86400000;
    // Include sleeps that overlap today's 24h window — not just ones that started today —
    // so an overnight sleep (start yesterday evening, end this morning) draws in full.
    const todaySleeps=sleeps.filter(s=>{
      const sEnd=s.end||now;
      return s.start<dayEndTs && sEnd>=todayStart;
    });

    // minutes-of-day → canvas angle (midnight = top)
    const m2a=m=>(m/1440)*Math.PI*2-Math.PI/2;
    // angle + radius → {x,y}
    const polar=(a,r)=>({x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r});

    useEffect(()=>{
      const canvas=canvasRef.current; if(!canvas)return;
      const dpr=window.devicePixelRatio||1;
      canvas.width=SIZE*dpr; canvas.height=SIZE*dpr;
      canvas.style.width=SIZE+"px"; canvas.style.height=SIZE+"px";
      const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,SIZE,SIZE);

      // ── base track ring ──
      ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,255,255,.06)"; ctx.lineWidth=22; ctx.stroke();
      ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
      ctx.strokeStyle="rgba(99,102,241,.08)"; ctx.lineWidth=18; ctx.stroke();

      // ── draw a sleep block as a thick arc capsule ──
      const drawArc=(startMin,endMin,solid,glowing)=>{
        const a1=m2a(startMin), a2=m2a(Math.min(endMin,1439));
        if(solid){
          // glow pass
          if(glowing){
            ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
            ctx.strokeStyle="rgba(139,92,246,.4)"; ctx.lineWidth=26;
            ctx.shadowBlur=20; ctx.shadowColor="#8b5cf6"; ctx.stroke(); ctx.shadowBlur=0;
          }
          // solid fill
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle=glowing?"#a78bfa":"rgba(139,92,246,.7)";
          ctx.lineWidth=18; ctx.lineCap="round"; ctx.stroke();
          // inner highlight
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=4; ctx.lineCap="round"; ctx.stroke();
        } else {
          // dashed predicted
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle="rgba(139,92,246,.35)"; ctx.lineWidth=18; ctx.lineCap="round"; ctx.stroke();
          ctx.setLineDash([5,6]);
          ctx.beginPath(); ctx.arc(CX,CY,R,a1,a2);
          ctx.strokeStyle="rgba(200,180,255,.55)"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.stroke();
          ctx.setLineDash([]);
        }
      };

      // ── actual sleeps today ──
      todaySleeps.forEach(s=>{
        const sm=minutesInDay(s.start);
        const em=s.end?minutesInDay(s.end):minutesInDay(now);
        drawArc(sm,em,true,!!activeSleep&&!s.end);
      });

      // ── predicted sleeps (next 2 from yesterday) ──
      if(nextPred&&nextPred.predictions){
        nextPred.predictions.forEach(p=>{
          const durMin=Math.round((p.durMs||5400000)/60000);
          drawArc(p.startMin, p.startMin+durMin, false, false);
        });
      }

      // ── sunrise anchor (real local time) ──
      const sunA=m2a(sunriseMin); const sunP=polar(sunA,R);
      ctx.beginPath(); ctx.arc(sunP.x,sunP.y,12,0,Math.PI*2);
      ctx.fillStyle="#1e1b3a"; ctx.fill();
      ctx.beginPath(); ctx.arc(sunP.x,sunP.y,12,0,Math.PI*2);
      ctx.strokeStyle="#f59e0b"; ctx.lineWidth=2;
      ctx.shadowBlur=16; ctx.shadowColor="#f59e0b"; ctx.stroke(); ctx.shadowBlur=0;

      // ── sunset anchor (real local time) ──
      const moonA=m2a(sunsetMin); const moonP=polar(moonA,R);
      ctx.beginPath(); ctx.arc(moonP.x,moonP.y,12,0,Math.PI*2);
      ctx.fillStyle="#1e1b3a"; ctx.fill();
      ctx.beginPath(); ctx.arc(moonP.x,moonP.y,12,0,Math.PI*2);
      ctx.strokeStyle="#fb923c"; ctx.lineWidth=2; ctx.stroke();

      // ── current time dot ──
      const nowA=m2a(minutesInDay(now)); const nowP=polar(nowA,R);
      ctx.beginPath(); ctx.arc(nowP.x,nowP.y,6,0,Math.PI*2);
      ctx.fillStyle="#fff"; ctx.shadowBlur=12; ctx.shadowColor="#fff"; ctx.fill(); ctx.shadowBlur=0;

    },[sleeps,now,nextPred,sunriseMin,sunsetMin]);

    // ── HTML capsule pills along the arc ──
    const capsules=useMemo(()=>{
      const caps=[];
      const PILL_R=R+38;
      todaySleeps.forEach((s,i)=>{
        const sm=minutesInDay(s.start);
        const em=s.end?minutesInDay(s.end):minutesInDay(now);
        // If the session wraps past midnight (em < sm), treat em as em+1440 for the
        // midpoint math, then normalize back into 0-1440 range.
        const rawMid=em<sm ? (sm+em+1440)/2 : (sm+em)/2;
        const midMin=rawMid%1440;
        const midAngle=m2a(midMin);
        const {x,y}=polar(midAngle,PILL_R);
        const dur=s.end?s.end-s.start:now-s.start;
        caps.push({x,y,label:fmtTime(s.start),sublabel:fmtDur(dur),solid:true,active:!s.end});
      });
      if(nextPred?.predictions){
        nextPred.predictions.slice(0,3).forEach(p=>{
          const durMin=Math.round((p.durMs||5400000)/60000);
          const midAngle=m2a(p.startMin+durMin/2);
          const {x,y}=polar(midAngle,PILL_R);
          caps.push({x,y,label:fmtTime(new Date(startOfDay(Date.now())+p.startMin*60000)),sublabel:"~"+Math.round(p.durMs/3600000*10)/10+(lang==="he"?"ש׳":"h"),solid:false,active:false});
        });
      }
      return caps;
    },[sleeps,now,nextPred]);

    const activeDur=activeSleep?now-activeSleep.start:null;

    return(
      <div style={{position:"relative",width:SIZE,height:SIZE,margin:"0 auto",flexShrink:0}}>
        <canvas ref={canvasRef} style={{position:"absolute",top:0,left:0,borderRadius:"50%"}}/>
        {/* Capsule pills */}
        {capsules.map((cap,i)=>(
          <div key={i} style={{
            position:"absolute", left:cap.x, top:cap.y,
            transform:"translate(-50%,-50%)",
            background:"rgba(15,12,40,.88)",
            border:`1px ${cap.solid?"solid":"dashed"} ${cap.active?"rgba(167,139,250,.9)":"rgba(139,92,246,.5)"}`,
            borderRadius:20, padding:"4px 9px",
            display:"flex",flexDirection:"column",alignItems:"center",gap:1,
            pointerEvents:"none", backdropFilter:"blur(8px)",
            boxShadow:cap.active?"0 0 12px rgba(139,92,246,.4)":"none",
            minWidth:52,
          }}>
            <span style={{fontSize:9,color:"rgba(196,181,253,.5)"}}>🌙</span>
            <span style={{fontSize:10,fontWeight:700,color:cap.active?"#c4b5fd":"rgba(196,181,253,.7)",whiteSpace:"nowrap"}}>{cap.label}</span>
            <span style={{fontSize:9,color:"rgba(148,130,220,.6)",whiteSpace:"nowrap"}}>{cap.sublabel}</span>
          </div>
        ))}
        {/* Sunrise & sunset emoji labels (real local times) */}
        {(()=>{const sunA=m2a(sunriseMin);const {x,y}=polar(sunA,R);return<div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",fontSize:14,lineHeight:1,pointerEvents:"none"}}>☀️</div>;})()}
        {(()=>{const moonA=m2a(sunsetMin);const {x,y}=polar(moonA,R);return<div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",fontSize:14,lineHeight:1,pointerEvents:"none"}}>🌇</div>;})()}
        {/* Now dot label */}
        {(()=>{const a=m2a(minutesInDay(now));const {x,y}=polar(a,R+20);return<div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",fontSize:9,color:"rgba(255,255,255,.5)",whiteSpace:"nowrap",pointerEvents:"none"}}>{fmtTime(now)}</div>;})()}
        {/* Centre */}
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,padding:"0 40px"}}>
          {activeSleep?(
            <>
              <div style={{fontSize:11,color:"rgba(196,181,253,.6)",fontWeight:600,letterSpacing:".08em",textTransform:"uppercase"}}>{lang==="he"?"ישן עכשיו":"Sleeping now"}</div>
              <div style={{fontSize:42,fontWeight:900,color:"#fff",lineHeight:1,fontVariantNumeric:"tabular-nums",letterSpacing:"-.02em"}}>{fmtDurEn(activeDur)}</div>
              <button onClick={onToggle} style={{marginTop:10,padding:"8px 22px",background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:20,color:"#fff",fontSize:12,fontWeight:800,boxShadow:"0 0 24px rgba(99,102,241,.6)",letterSpacing:".02em"}}>
                {S.sleep.endSleep}
              </button>
            </>
          ):(
            <>
              {nextPred&&nextPred.predictions?.length?(
                <>
                  <div style={{fontSize:11,color:"rgba(196,181,253,.55)",fontWeight:500,textAlign:"center",lineHeight:1.3}}>{lang==="he"?"שינה הבאה בעוד":"Next nap in"}</div>
                  <div style={{fontSize:46,fontWeight:900,color:"#fff",lineHeight:1,letterSpacing:"-.03em"}}>
                    {nextPred.predictions[0].minsFromNow<60
                      ?nextPred.predictions[0].minsFromNow+(lang==="he"?"ד׳":" min")
                      :(Math.round(nextPred.predictions[0].minsFromNow/6)/10)+(lang==="he"?"ש׳":" hr")}
                  </div>
                  <button onClick={onToggle} style={{marginTop:8,padding:"7px 20px",background:"rgba(99,102,241,.18)",border:"1px solid rgba(139,92,246,.4)",borderRadius:20,color:"#c4b5fd",fontSize:11,fontWeight:700}}>
                    {lang==="he"?"ישן עכשיו":"Sleep now"}
                  </button>
                </>
              ):(
                <>
                  <div style={{fontSize:12,color:"rgba(196,181,253,.45)",textAlign:"center",lineHeight:1.6,padding:"0 10px"}}>{lang==="he"?"לחץ להתחיל מעקב שינה":"Tap to start tracking sleep"}</div>
                  <button onClick={onToggle} style={{marginTop:10,padding:"9px 24px",background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:20,color:"#fff",fontSize:13,fontWeight:800,boxShadow:"0 0 24px rgba(99,102,241,.5)"}}>
                    {S.sleep.startSleep}
                  </button>
                </>
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  // ─── SLEEP TAB ───────────────────────────────────────────────────────────────
  function SleepTab({T,S,lang,sunTimes,sleeps,setSleeps}){
    const[now,setNow]=useState(Date.now());
    useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),15000);return()=>clearInterval(t);},[]);
    useEffect(()=>saveLS("ww_sleeps",sleeps),[sleeps]);

    const activeSleep=sleeps.find(s=>!s.end);
    const todayStart=startOfDay(Date.now());

    // Find the most recent overnight sleep (start/end on different calendar days)
    // and use ITS wake time as the boundary for "today's sleep" — this is more
    // meaningful for babies than a rigid midnight cutoff.
    const morningWakeTs=useMemo(()=>{
      const overnightSleeps=sleeps.filter(s=>s.end&&dayKey(s.start)!==dayKey(s.end)&&s.end<=now);
      if(!overnightSleeps.length)return todayStart;
      return overnightSleeps.reduce((latest,s)=>s.end>latest?s.end:latest,0);
    },[sleeps,now]);

    const todaySleeps=sleeps.filter(s=>s.start>=morningWakeTs);
    const totalTodayMs=todaySleeps.reduce((acc,s)=>{const dur=s.end?s.end-s.start:now-s.start;return acc+dur;},0);
    const nowMin=minutesInDay(now);
    const yesterday=sleeps.filter(s=>s.start>=todayStart-86400000&&s.start<todayStart);

    const nextSleepPred=useMemo(()=>{
      if(activeSleep)return null;
      const future=yesterday.filter(s=>s.end&&minutesInDay(s.start)>nowMin).sort((a,b)=>minutesInDay(a.start)-minutesInDay(b.start));
      if(!future.length)return null;
      const predictions=future.slice(0,3).map(s=>({
        startMin:minutesInDay(s.start),
        minsFromNow:minutesInDay(s.start)-nowMin,
        durMs:s.end-s.start,
      }));
      return{predictions};
    },[sleeps,now]);

    const avgDurMs=useMemo(()=>{
      const finished=sleeps.filter(s=>s.end).slice(-14);
      if(!finished.length)return null;
      return finished.reduce((a,s)=>a+(s.end-s.start),0)/finished.length;
    },[sleeps]);

    const toggleSleep=()=>{
      haptic(activeSleep?12:15);
      if(activeSleep)setSleeps(prev=>prev.map(s=>s.id===activeSleep.id?{...s,end:Date.now(),updatedAt:Date.now()}:s));
      else {setSleeps(prev=>[...prev,{id:Date.now(),start:Date.now(),end:null,updatedAt:Date.now()}]);window.logAnalyticsEvent("record_added",{type:"sleep"});}
    };
    const deleteSleep=id=>setSleeps(prev=>prev.filter(s=>s.id!==id));
    const recentSleeps=[...sleeps].filter(s=>s.start>=todayStart-13*86400000).sort((a,b)=>b.start-a.start).slice(0,500);

    // ── Edit sheet state ──
    const[editSheetOpen,setEditSheetOpen]=useState(false);
    const[editId,setEditId]=useState(null);
    const[editStartDate,setEditStartDate]=useState("");
    const[editStartTime,setEditStartTime]=useState("");
    const[editEndDate,setEditEndDate]=useState("");
    const[editEndTime,setEditEndTime]=useState("");
    const[hasEnd,setHasEnd]=useState(true);
    const todayDateStr=tsToDateStr(now);

    const openEditSleep=s=>{
      haptic(8);
      setEditId(s.id);
      setEditStartDate(tsToDateStr(s.start)); setEditStartTime(tsToTimeStr(s.start));
      if(s.end){setHasEnd(true); setEditEndDate(tsToDateStr(s.end)); setEditEndTime(tsToTimeStr(s.end));}
      else{setHasEnd(false); setEditEndDate(tsToDateStr(now)); setEditEndTime(tsToTimeStr(now));}
      setEditSheetOpen(true);
    };
    const saveEditSleep=()=>{
      haptic(12);
      const startTs=dateTimeToTs(editStartDate,editStartTime);
      const endTs=hasEnd?dateTimeToTs(editEndDate,editEndTime):null;
      setSleeps(prev=>prev.map(s=>s.id===editId?{...s,start:startTs,end:(hasEnd&&endTs>startTs)?endTs:(hasEnd?s.end:null),updatedAt:Date.now()}:s));
      setEditSheetOpen(false);
    };
    const deleteFromEditSheet=()=>{haptic(15);setSleeps(prev=>prev.filter(s=>s.id!==editId));setEditSheetOpen(false);};

    return(
      <div style={{display:"flex",flexDirection:"column",gap:14,padding:"0 0 16px"}}>
        {/* Circular timeline hero */}
        <div style={{background:"linear-gradient(135deg,#0d0f2b,#151832)",borderRadius:24,padding:"20px 0 16px",border:"1px solid rgba(99,102,241,.2)",boxShadow:"0 8px 32px rgba(0,0,0,.4)"}}>
          <CircularTimeline sleeps={sleeps} activeSleep={activeSleep} nextPred={nextSleepPred} now={now} onToggle={toggleSleep} S={S} lang={lang} sunTimes={sunTimes}/>
          {/* Sunrise/sunset markers (real local times if available) */}
          <div style={{display:"flex",justifyContent:"center",gap:32,marginTop:12}}>
            <div style={{textAlign:"center"}}><div style={{fontSize:20}}>🌅</div><div style={{fontSize:11,color:"rgba(251,146,60,.8)",fontWeight:700,marginTop:2}}>{sunTimes?fmtTime(startOfDay(Date.now())+sunTimes.sunriseMin*60000):"06:00"}</div></div>
            <div style={{textAlign:"center"}}><div style={{fontSize:20}}>🌇</div><div style={{fontSize:11,color:"rgba(251,146,60,.8)",fontWeight:700,marginTop:2}}>{sunTimes?fmtTime(startOfDay(Date.now())+sunTimes.sunsetMin*60000):"20:00"}</div></div>
          </div>
          {/* Naïve prediction note */}
          <div style={{textAlign:"center",fontSize:10,color:"rgba(165,180,252,.35)",marginTop:8,padding:"0 20px"}}>{S.sleep.naiveNote}</div>
        </div>

        {/* Stats row */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <StatCard icon="🌙" label={S.sleep.totalToday} value={totalTodayMs>0?fmtDur(totalTodayMs):"—"} sub={avgDurMs?`${S.sleep.avgDuration}: ${fmtDur(avgDurMs)}`:""} T={T}/>
          <StatCard icon="📊" label={S.sleep.nextSleep} value={nextSleepPred?.predictions?.[0]?(nextSleepPred.predictions[0].minsFromNow<60?nextSleepPred.predictions[0].minsFromNow+(lang==="he"?"ד׳":"m"):Math.round(nextSleepPred.predictions[0].minsFromNow/60)+(lang==="he"?"ש׳":"h")):"—"} sub={nextSleepPred?.predictions?.[0]?("~"+fmtDur(nextSleepPred.predictions[0].durMs)):S.sleep.naiveNote} T={T}/>
        </div>

        {/* 7-day pattern */}
        <PatternGrid events={sleeps} color={T.sleepColor} bgColor={T.sleepBg} T={T} S={S} type="sleep"/>

        {/* History — grouped by day, collapsible */}
        <div style={{background:T.surface,borderRadius:16,padding:"14px",border:`1px solid ${T.surfaceB}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:recentSleeps.length?10:0}}>
            <div style={{fontSize:12,fontWeight:700,color:T.sub}}>{S.sleep.history}</div>
            {recentSleeps.length>0&&<div style={{fontSize:10,color:T.muted}}>{lang==="he"?"לחץ לעריכה":"Tap to edit"}</div>}
          </div>
          {recentSleeps.length===0
            ?<EmptyState Icon={IconMoonZzz} accent={T.sleepColor} T={T} text={S.sleep.noSleeps}/>
            :(()=>{
                const groups=[];
                const map={};
                recentSleeps.forEach(s=>{
                  const k=dayKey(s.start);
                  if(!(k in map)){map[k]={dayStart:startOfDay(s.start),entries:[]};groups.push(map[k]);}
                  map[k].entries.push(s);
                });
                return<div style={{display:"flex",flexDirection:"column",gap:2}}>
                  {groups.map((g,gi)=>{
                    const c=DAY_COLORS[gi%DAY_COLORS.length];
                    const totalMs=g.entries.reduce((acc,s)=>acc+(s.end?s.end-s.start:now-s.start),0);
                    const n=g.entries.length;
                    const countLabel=lang==="he"?`${n} ${n===1?"שינה":"שינות"}`:`${n} ${n===1?"sleep":"sleeps"}`;
                    return(
                      <DayGroup key={dayKey(g.dayStart)} T={T} dayStart={g.dayStart} lang={lang} accent={c} defaultOpen={gi===0} summary={`${countLabel} · ${fmtDur(totalMs)}`}>
                        {g.entries.map(s=>(
                          <SwipeableRow key={s.id} T={T} onDelete={()=>deleteSleep(s.id)} onTap={()=>openEditSleep(s)}>
                            <SleepRow s={s} now={now} T={T} S={S} lang={lang} dayColor={c}/>
                          </SwipeableRow>
                        ))}
                      </DayGroup>
                    );
                  })}
                </div>;
              })()}
        </div>

        {/* Edit sleep bottom sheet */}
        <BottomSheet open={editSheetOpen} onClose={()=>setEditSheetOpen(false)} T={T}>
          <div style={{fontSize:16,fontWeight:800,color:T.text,marginBottom:16,textAlign:"center"}}>{lang==="he"?"עריכת שינה":"Edit Sleep"}</div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:6}}>🕐 {lang==="he"?"התחלה":"Start"}</div>
            <DateTimeField dateStr={editStartDate} timeStr={editStartTime} onDateChange={setEditStartDate} onTimeChange={setEditStartTime} T={T} lang={lang} maxDate={todayDateStr}/>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{fontSize:11,fontWeight:700,color:T.sub}}>🕐 {lang==="he"?"סיום":"End"}</div>
              <button onClick={()=>{haptic(6);setHasEnd(h=>!h);}} style={{fontSize:11,fontWeight:700,color:hasEnd?T.sub:T.accentText,background:"none",padding:"2px 4px"}}>
                {hasEnd?(lang==="he"?"עדיין ישן?":"Still sleeping?"):"✓ "+(lang==="he"?"עדיין ישן":"Still sleeping")}
              </button>
            </div>
            {hasEnd&&<DateTimeField dateStr={editEndDate} timeStr={editEndTime} onDateChange={setEditEndDate} onTimeChange={setEditEndTime} T={T} lang={lang} maxDate={todayDateStr}/>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={deleteFromEditSheet} style={{padding:"0 18px",background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IconTrash size={17} color="#ef4444"/>
            </button>
            <button onClick={saveEditSleep} style={{flex:1,padding:14,background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:14,color:"#fff",fontSize:15,fontWeight:800,boxShadow:"0 4px 20px rgba(99,102,241,.4)"}}>{lang==="he"?"שמור":"Save"}</button>
          </div>
        </BottomSheet>
      </div>
    );
  }

  function SleepRow({s,now,T,S,lang,dayColor}){
    const dur=s.end?s.end-s.start:now-s.start;
    const isActive=!s.end;
    const arrow=lang==="he"?"←":"→";
    const c=dayColor||"#6366f1";
    return<div style={{display:"flex",alignItems:"center",gap:11,padding:"9px 10px"}}>
      <div style={{width:32,height:32,borderRadius:11,background:`${c}22`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:isActive?`0 0 0 2px ${c}88`:"none"}}>
        <IconMoonZzz size={15} color={c}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13.5,fontWeight:700,color:T.text}}>
          <span>{fmtTime(s.start)}</span>
          {s.end?<>
            <span style={{color:T.muted,fontSize:12,fontWeight:400}}>{arrow}</span>
            <span>{fmtTime(s.end)}</span>
          </>:<span style={{color:"#818cf8",fontWeight:600,fontSize:12}}>{lang==="he"?"ישן עכשיו":"sleeping now"}</span>}
          <span style={{fontSize:11,color:T.sub,fontWeight:500,marginInlineStart:"auto"}}>{fmtDur(dur)}</span>
        </div>
        <div style={{fontSize:11,color:T.sub,marginTop:1}}>{new Date(s.start).toLocaleDateString(lang==="he"?"he-IL":"en-US",{day:"numeric",month:"short"})}</div>
      </div>
    </div>;
  }

  // ─── FEED TAB ────────────────────────────────────────────────────────────────
  function FeedTab({T,S,lang,feeds,setFeeds,weights}){
    const[sheetOpen,setSheetOpen]=useState(false);
    const[editingId,setEditingId]=useState(null); // null = adding new
    const[feedType,setFeedType]=useState("breast");
    const[feedAmt,setFeedAmt]=useState("");
    const[feedPrepared,setFeedPrepared]=useState("");
    const[feedNote,setFeedNote]=useState("");
    const[feedDate,setFeedDate]=useState(()=>tsToDateStr(Date.now()));
    const[feedTimeOnly,setFeedTimeOnly]=useState(()=>tsToTimeStr(Date.now()));

    useEffect(()=>saveLS("ww_feeds",feeds),[feeds]);

    const todayStart=startOfDay(Date.now());
    const todayFeeds=feeds.filter(f=>f.start>=todayStart);
    const recentFeeds=[...feeds].filter(f=>f.start>=todayStart-13*86400000).sort((a,b)=>b.start-a.start).slice(0,500);
    const lastFeed=recentFeeds[0];

    // Avg interval prediction
    const avgIntervalMs=useMemo(()=>{
      const sorted=[...feeds].sort((a,b)=>a.start-b.start);
      if(sorted.length<2)return null;
      const intervals=[];
      for(let i=1;i<Math.min(sorted.length,10);i++)intervals.push(sorted[i].start-sorted[i-1].start);
      return intervals.reduce((a,b)=>a+b,0)/intervals.length;
    },[feeds]);

    const nextFeedIn=lastFeed&&avgIntervalMs?Math.max(0,Math.round((lastFeed.start+avgIntervalMs-Date.now())/60000)):null;

    // Bottle consumption vs recommended daily target: min(150ml * weightKg, 960ml)
    const latestWeightKg=useMemo(()=>{
      if(!weights.length)return null;
      return[...weights].sort((a,b)=>b.date-a.date)[0].kg;
    },[weights]);
    const bottleTodayMl=useMemo(()=>todayFeeds.filter(f=>f.type==="bottle"&&f.amount).reduce((a,f)=>a+f.amount,0),[todayFeeds]);
    const recommendedMl=latestWeightKg?Math.min(150*latestWeightKg,960):null;

    const openAddSheet=()=>{
      haptic(10);
      setEditingId(null); setFeedType("breast"); setFeedAmt(""); setFeedPrepared(""); setFeedNote("");
      setFeedDate(tsToDateStr(Date.now())); setFeedTimeOnly(tsToTimeStr(Date.now()));
      setSheetOpen(true);
    };
    const openEditSheet=f=>{
      haptic(8);
      setEditingId(f.id); setFeedType(f.type); setFeedAmt(f.amount?String(f.amount):""); setFeedPrepared(f.prepared?String(f.prepared):""); setFeedNote(f.note||"");
      setFeedDate(tsToDateStr(f.start)); setFeedTimeOnly(tsToTimeStr(f.start));
      setSheetOpen(true);
    };
    const saveFeed=()=>{
      haptic(15);
      const ts=dateTimeToTs(feedDate,feedTimeOnly);
      const amt=feedAmt?parseInt(feedAmt):null;
      const prep=feedPrepared?parseInt(feedPrepared):null;
      const note=feedNote.trim()?feedNote.trim():null;
      if(editingId)setFeeds(prev=>prev.map(f=>f.id===editingId?{...f,type:feedType,amount:amt,prepared:prep,note,start:ts,updatedAt:Date.now()}:f));
      else {setFeeds(prev=>[...prev,{id:Date.now(),start:ts,type:feedType,amount:amt,prepared:prep,note,updatedAt:Date.now()}]);window.logAnalyticsEvent("record_added",{type:"feed"});}
      setSheetOpen(false);
    };
    const deleteFeed=id=>setFeeds(prev=>prev.filter(f=>f.id!==id));
    const deleteFromSheet=()=>{haptic(15);setFeeds(prev=>prev.filter(f=>f.id!==editingId));setSheetOpen(false);};

    const typeEmoji={breast:"🤱",bottle:"🍼",solid:"🥣"};
    const todayDateStr=tsToDateStr(Date.now());

    return(

  // ─── CSV EXPORT ──────────────────────────────────────────────────────────────
  function csvEsc(v){
    if(v===null||v===undefined)return"";
    const s=String(v);
    return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }
  function buildCSV(sleeps,feeds,weights,lang){
    const lines=[];
    lines.push(lang==="he"?"נתוני שינה":"Sleep Entries");
    lines.push(["Start","End","Duration (min)"].map(csvEsc).join(","));
    [...sleeps].sort((a,b)=>a.start-b.start).forEach(s=>{
      const durMin=s.end?Math.round((s.end-s.start)/60000):"";
      lines.push([new Date(s.start).toISOString(),s.end?new Date(s.end).toISOString():"",durMin].map(csvEsc).join(","));
    });
    lines.push("");
    lines.push(lang==="he"?"נתוני האכלה":"Feed Entries");
    lines.push(["DateTime","Type","Prepared (ml)","Consumed (ml)","Note"].map(csvEsc).join(","));
    [...feeds].sort((a,b)=>a.start-b.start).forEach(f=>{
      lines.push([new Date(f.start).toISOString(),f.type,f.prepared??"",f.amount??"",f.note??""].map(csvEsc).join(","));
    });
    lines.push("");
    lines.push(lang==="he"?"נתוני משקל":"Weight Entries");
    lines.push(["Date","Weight (kg)"].map(csvEsc).join(","));
    [...weights].sort((a,b)=>a.date-b.date).forEach(w=>{
      lines.push([new Date(w.date).toISOString(),w.kg].map(csvEsc).join(","));
    });
    return"\uFEFF"+lines.join("\n");
  }
  function downloadFile(content,filename,mime){
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function sanitizeFilePart(s){
    return(s||"").trim().replace(/[^a-zA-Z0-9\u0590-\u05FF_-]+/g,"-").replace(/^-+|-+$/g,"")||"";
  }

  // ─── BACKUP CODE ENCODE/DECODE (UTF-8 safe base64) ──────────────────────────
  function encodeBackup(state){
    const json=JSON.stringify(state);
    return btoa(unescape(encodeURIComponent(json)));
  }
  function decodeBackup(code){
    const json=decodeURIComponent(escape(atob(code.trim())));
    return JSON.parse(json);
  }

  // ─── EXPORT SECTION ──────────────────────────────────────────────────────────
  function ExportSection({T,S,lang,babyName,birthDate}){
    const doExport=()=>{
      haptic(10);
      const sleeps=loadLS("ww_sleeps",[]);
      const feeds=loadLS("ww_feeds",[]);
      const weights=loadLS("ww_weights",[]);
      const csv=buildCSV(sleeps,feeds,weights,lang);
      const namePart=sanitizeFilePart(babyName)||"baby";
      const dobPart=birthDate||"unknown-dob";
      const todayPart=tsToDateStr(Date.now());
      const filename=`wonder-weeks-${namePart}-dob-${dobPart}-export-${todayPart}.csv`;
      downloadFile(csv,filename,"text/csv;charset=utf-8;");
    };
    return(
      <button onClick={doExport} style={{padding:14,background:T.surface,border:`1px solid ${T.surfaceB}`,borderRadius:14,color:T.text,fontSize:13.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
